<input type="file" id="homeVideoInput" accept="video/*" style="display:none" />
<button id="homeUploadBtn" style="position:fixed; bottom:80px; right:20px; width:60px; height:60px; background:#FFD700; color:#000; border-radius:50%; font-size:30px; border:none; z-index:99">+</button>
<script>
document.getElementById('homeUploadBtn').onclick = () => document.getElementById('homeVideoInput').click();
document.getElementById('homeVideoInput').onchange = function(e){
 let f=e.target.files[0];
 if(f){
  let u=URL.createObjectURL(f);
  let t=prompt("Video ka naam:");
  let b=document.createElement('div');
  b.style="padding:10px; margin:10px; background:#151821; border-radius:10px";
  b.innerHTML=`<video src="${u}" controls style="width:100%; border-radius:10px"></video><p style="color:white; margin-top:8px">${t||'Mera Video'}</p>`;
  document.getElementById('root').prepend(b);
 }
}
</script>
