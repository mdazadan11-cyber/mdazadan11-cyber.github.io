<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZAD V208 FINAL</title>
<style>
body{background:#080808;color:#fff;font-family:system-ui;text-align:center;margin:0;padding:14px}
h1{color:#FFEB3B;margin:8px 0;font-size:20px}
#btn{width:190px;height:190px;border-radius:50%;background:#FFEB3B;color:#000;font-size:22px;font-weight:900;border:4px solid #000;margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
#btn.listening{background:#ff2d2d;color:#fff}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:10px;margin:10px auto;max-width:420px;text-align:left}
.small{background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:10px;padding:9px 12px;margin:4px}
.green{color:#00e676}
</style>
</head>
<body>
<h1>AZAD V208 FINAL<br>NO LOOP</h1>
<div class="card">
🎤 Mic: <span id="mic">Not Allowed</span> <button class="small" onclick="askMic()">Mic Allow Mango</button><br>
📷 Camera: <span id="cam">Not Allowed</span> <button class="small" onclick="askCam()">Camera Allow</button><br>
🔔 Notif: <span id="not">Not Allowed</span> <button class="small" onclick="askNot()">Notif Allow</button>
</div>
<button id="btn" onclick="startListening()">BHAI SUN</button>
<div id="status">Idle</div>
<div class="card">Last: <b id="last">Kuch nahi</b></div>
<div>
<button class="small" onclick="openSite('facebook')">Facebook</button>
<button class="small" onclick="openSite('youtube')">YouTube</button>
<button class="small" onclick="openSite('google')">Google</button>
</div>
<script>
let isSpeaking=false,rec=null;const BAD=["lund","gand","chut","madarchod","behenchod","bhosdi","loda","randi"];
function askMic(){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{document.getElementById('mic').innerHTML='<span class=green>Allowed ✓</span>';s.getTracks().forEach(t=>t.stop())})}
function askCam(){navigator.mediaDevices.getUserMedia({video:true}).then(s=>{document.getElementById('cam').innerHTML='<span class=green>Allowed ✓</span>';s.getTracks().forEach(t=>t.stop())})}
function askNot(){Notification.requestPermission().then(p=>{document.getElementById('not').innerText=p})}
function openSite(n){let url=n=='facebook'?'https://facebook.com':n=='youtube'?'https://youtube.com':'https://google.com';window.open(url,'_blank');speakOnce(n+' khol diya');document.getElementById('last').innerText=n+' Opened'}
function isAbusive(t){t=t.toLowerCase();for(let w of BAD){if(t.includes(w))return true}return false}
function speakOnce(txt){if(isSpeaking)return;isSpeaking=true;let u=new SpeechSynthesisUtterance(txt);u.lang='hi-IN';u.onend=()=>{isSpeaking=false;document.getElementById('status').innerText='Ho gaya'};speechSynthesis.speak(u)}
function startListening(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang='hi-IN';rec.continuous=false;document.getElementById('btn').classList.add('listening');document.getElementById('status').innerText='Sun raha hoon...';rec.onresult=(e)=>{rec.stop();document.getElementById('btn').classList.remove('listening');let txt=e.results[0][0].transcript;if(isAbusive(txt)){document.getElementById('last').innerHTML='Blocked';speakOnce('Kaam ki baat bolo');return}let low=txt.toLowerCase();if(low.includes('facebook'))openSite('facebook');else if(low.includes('youtube'))openSite('youtube');else if(low.includes('google'))openSite('google');else{speakOnce('Bolo Facebook kholo')}};rec.onerror=()=>{document.getElementById('btn').classList.remove('listening')};rec.onend=()=>{document.getElementById('btn').classList.remove('listening')};rec.start()}
</script>
</body>
</html>
