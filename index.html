ha. Uske haath me ek purani kitaab thi.

Baba kehte the, gaon me sham ka matlab hota hai kahani ka samay. Har ghar ke aangan me koi na koi kahani chal rahi hoti hai. Kahi chulhe par roti sek rahi dadi apne pote ko raja-rani ki kahani suna rahi hai, to kahi chaupal par buzurg hukka peete hue apne jawaani ke kisse.

Aaj Azad ne socha, woh bhi ek kahani likhega. Lekin kaisi? Usne aas paas dekha. Ek kutta tha jo roz sham ko usi jagah aake baithta tha, jaise kisi ka intezaar kar raha ho. Ek ped tha, jiska naam kisi ne nahi rakha tha, par sab uske neeche baithte the. Aur ek hawa thi, jo khet se aake seedha dil me utar jaati thi.

Usne likhna shuru kiya. "Ek tha gaon, jahan sham kabhi khatam nahi hoti thi." Likhte likhte raat ho gayi. Taare nikal aaye. Gaon ki auratein geet gaane lagi. Azad ko laga, uski kahani khud-b-khud gaon ki hawa me ghul rahi hai. Tabhi usko samajh aaya, gaon ki sham khud ek kahani hai, jise roz likha jaata hai, par kabhi khatam nahi hota. Woh ghar lauta, aur us raat usne apni pehli poori kahani likhi, sirf gaon ki sham ke naam.`},{id:2,title:"Bhoot Aur Baccha",tag:"Bhoot",readTime:"6 min",color:"#C7D2FE",content:`Bachpan me sabse badi kahani bhoot ki hoti hai. Har gali me ek ghar hota hai jahan koi nahi rehta, aur kehte hain wahan bhoot rehta hai.

Chintu 9 saal ka tha. Uske dost kehte the, purane school ke peeche jo peepal ka ped hai, wahan raat ko bhoot aata hai. Chintu ko dar lagta tha, par usko curiosity bhi thi. Ek din usne socha, dekhega zaroor.

Sham ko woh chupke se peepal ke paas gaya. Wahan sach me andhera tha. Hawa tez chal rahi thi. Patte khadak rahe the. Tabhi usko ek awaaz sunai di, "Kaun hai?"

Chintu ka dil zor se dhadakne laga. Usne himmat karke kaha, "Main Chintu." Jawab aaya, "Main Bholu. Yahan kyu aaya?" Ped ke peeche se ek baccha nikla, usi umar ka, par uske kapde purane the. Woh bola, "Sab mujhe bhoot kehte hain, kyunki main yahan akela rehta hoon. Mere maa-baap sheher chale gaye."

Chintu ko samajh aaya, bhoot koi nahi hota. Akela pan bhoot hota hai. Us din se dono dost ban gaye. Ab woh peepal ka ped bhoot ka nahi, dosti ka ped kehlata hai.`},{id:3,title:"Prem Kahani",tag:"Prem",readTime:"4 min",color:"#FBCFE8",content:`Prem kahani hamesha filmon jaisi nahi hoti. Kabhi kabhi woh sirf ek chai ki dukaan se shuru hoti hai.

Ramesh roz subah 7 baje chai peene aata tha. Sunita usi dukaan par chai banati thi. Na zyada baat, na zyada dekha. Bas ek muskaan. Ramesh ko uski chai me kuch alag lagta tha. Shayad meetha zyada nahi, par ehsaas zyada tha.

Ek din barish ho rahi thi. Dukaan khali thi. Ramesh ne himmat karke kaha, "Tumhari chai me kya daalti ho, jo itni yaad aati hai?" Sunita hasi, "Intezaar." Ramesh samjha nahi. Sunita boli, "Main roz sochti thi, tum kab aaoge, isliye chai me intezaar ghul jata hai."

Us din dono ne barish me chai pi, bina kuch kahe. Prem ko shabdon ki zarurat nahi hoti. Kabhi kabhi sirf ek cup chai kaafi hoti hai, do dilon ko milane ke liye.`},{id:4,title:"Azad Ki Udaan",tag:"Azad",readTime:"5 min",color:"#A7F3D0",content:`Azad ko bachpan se udna tha. Par uske paas pankh nahi the. Uske paas sirf ek sapna tha.

Gaon ke sab log kehte the, "Padh le, khet sambhal, udne se pet nahi bharta." Par Azad ka dil maanta hi nahi tha. Woh roz chhat par jaake patang udata tha, aur sochta tha, ek din main bhi aise udunga.

Ek din usne kagaz se ek hawai jahaz banaya. Us par likha, "Main Azad hoon." Aur use hawa me phenk diya. Jahaz udta hua khet tak gaya. Wahan ek buddha aadmi ne use uthaya aur padha. Woh aadmi hasa aur bola, "Udan pankh se nahi, soch se hoti hai."

Azad ne us din se likhna shuru kiya. Likhna uski udaan ban gaya. Har kahani ek naya aasman thi. Aaj Azad ki kitaab har dukaan par hai. Par woh ab bhi chhat par jaake patang udata hai. Kyunki usko pata hai, asli udaan kabhi khatam nahi hoti.`},{id:5,title:"Samandar Ki Lehren",tag:"Samandar",readTime:"4 min",color:"#BAE6FD",content:`Samandar har roz kinare se kehta hai, aa ja. Par kinara kabhi jaata nahi.

Raju machuara tha. Roz samandar jaata, jaal phenkta. Ek din samandar shant tha, ekdum shant. Raju ne socha, aaj machli nahi milegi. Par usne jaal phenka, aur usme ek chitthi phansi hui mili. Chitthi par likha tha, "Main lehar hoon, roz aati hoon, roz jaati hoon. Tum kab aaoge?"

Raju hasa, lehar bhi chitthi likhti hai? Usne chitthi ko wapas samandar me phenk diya. Agle din phir ek chitthi, "Tumne jawab nahi diya." Raju ne is baar jawab likha, "Main kinara hoon, ja nahi sakta." Lehar ne likha, "Kinara hona matlab rukna nahi, intezaar karna hai."`},{id:6,title:"Pahadon Ki Kahani",tag:"Pahad",readTime:"5 min",color:"#E0E7FF",content:`Pahad kabhi bolte nahi, par bahut kuch kehte hain. Meera pehli baar pahad gayi thi. Sheher ki ladki, shor se tang. Usne socha, pahad par shanti milegi. Par pahad par toh aur bhi bada shor tha, hawa ka, paani ka, chidiyon ka.

Pehle din usko ajeeb laga. Dusre din usko thoda sukoon mila. Teesre din usne pahad se baat karni shuru ki. Boli, "Tum itne bade kaise ho?" Pahad ne jawab nahi diya, par ek pathar gira. Meera samjhi, bada hone ke liye girna padta hai.

Meera wahan 7 din rahi. Har din ek naya sabak. Kabhi dhundh se seekha ki sab kuch saaf dikhna zaruri nahi, kabhi nadi se seekha ki behti rehna zaruri hai. Jab woh lauti, to woh wahi nahi thi.`},{id:7,title:"Sheher Ki Roshni",tag:"Sheher",readTime:"5 min",color:"#FEF08A",content:`Sheher ki roshni din me nahi dikhti, raat me chamakti hai. Aman gaon se sheher aaya tha, naukri ke liye. Gaon me andhera hota tha, taare dikhte the. Sheher me roshni itni thi ki taare dikhte hi nahi the.

Pehle usko laga, sheher me sab kuch hai. Dheere dheere usko laga, sheher me sab kuch hai, par sukoon nahi. Roz office, bus, bheed. Ek din woh chhat par gaya, raat ko. Neeche dekha, gaadiyon ki roshni, dukaanon ki roshni, gharo ki roshni. Itni roshni, phir bhi sab bhaag rahe hain.

Usne apni maa ko phone kiya, "Maa, yahan roshni bahut hai, par neend nahi aati." Maa boli, "Roshni aankh me nahi, dil me chahiye." Aman ne agle din apne kamre me ek diya jalaya.`},{id:8,title:"Chai Ki Dukaan",tag:"Chai",readTime:"3 min",color:"#FDE68A",content:`Chai ki dukaan sirf chai nahi bechti, kahaniyan bechti hai. Har subah 6 baje, dukaan khulti hai. Pehle aate hain akhbaar wale, phir school ke bacche, phir office wale. Har ek ki apni kahani, par chai sabki ek jaisi.

Dukaan wala Ramu kaka sabki kahani sunta hai. Kabhi hasa deta hai, kabhi chup rehta hai. Uski chai me ek jaadu hai, peete hi dil halka ho jata hai.

Ek din ek aadmi aaya, bahut pareshan. Bola, "Kaka, zindagi samajh nahi aati." Kaka ne chai di, bola, "Chai jaise hai zindagi, kadvi bhi, meethi bhi, garam bhi, thandi bhi. Bas peete rehna hai."`},{id:9,title:"Purana Kua",tag:"Raaz",readTime:"6 min",color:"#DDD6FE",content:`Gaon me ek purana kua tha, jiska paani kabhi khatam nahi hota tha. Kehte the, usme ek ichha poori karne wala patthar hai. Sab usme sikka phenkte the. Azad ne bhi ek sikka phenka, aur manga, "Mujhe kahani likhna aaye." Kue se awaaz aayi, "Kahani paani jaisi hai, andar se aati hai."

Azad samjha nahi. Roz kue par jaane laga. Ek din usne andar jhanka, to apna hi aks dekha. Tab samajh aaya, kua khali nahi, bhara hua hai, humse hi.`},{id:10,title:"Cycle Wala Dost",tag:"Dosti",readTime:"4 min",color:"#FED7AA",content:`Dosti kabhi kabhi ek cycle se shuru hoti hai. Sonu ke paas nayi cycle thi, Monu ke paas nahi. Sonu roz Monu ke ghar ke saamne se nikalta, ghanti bajata. Monu dekhta rehta.

Ek din Sonu ne kaha, "Chal, saath ghoomte hain, tu peeche baith." Monu peeche baitha, dono pure gaon ghoome. Tab se roz ka niyam ban gaya. Aage Sonu, peeche Monu. Kabhi kabhi Monu aage, Sonu peeche.

Log kehte, cycle ek hai, dost do. Par dost kehte, dost ek hai, cycle to bahana hai.`},{id:11,title:"Barish Ka Pehla Din",tag:"Barish",readTime:"4 min",color:"#BFDBFE",content:`Barish ka pehla din hamesha yaad rehta hai. Garmi se jale hue khet, sookhe hue ped, sab intezaar me the. Aasman kaala hua, hawa chali, aur pehli boond giri. Bacche bhaagne lage, "Barish aayi, barish aayi."

Azad kitaab band karke bahar aaya. Mitti ki khushboo, aisi khushboo jo sirf pehli barish me aati hai. Usne haath aage kiya, boond hatheli par giri, thandi. Gaon ki auratein bartan leke bahar aa gayi, paani bharne. Bacche kagaz ki naav banane lage.`},{id:12,title:"Maa Ki Rasoi",tag:"Maa",readTime:"5 min",color:"#FECACA",content:`Maa ki rasoi me jadoo hota hai. Bina measurement ke, bas haath se andaaze se, par swaad aisa ki hotel fail. Azad jab bhi sheher se gaon aata, pehle rasoi me jaata. Maa kehti, "Haath dho le." Azad kehta, "Pehle khushboo le lu."

Rasoi choti si, par usme poora ghar basta tha. Ek kone me masale, dusre me aata, beech me chulha. Maa chulhe par roti sek ti, aur kahaniyan bhi. "Beta, daal me namak kam hai to pyaar zyada daal de," maa kehti.`},{id:13,title:"Nadi Kinare",tag:"Nadi",readTime:"4 min",color:"#A5F3FC",content:`Nadi kinare baithne se mann shant ho jata hai. Gaon ke bahar ek nadi behti thi, choti si, par kabhi sookhti nahi thi. Sham ko sab wahan jaate the. Koi kapde dhone, koi pair latkane.

Azad ko wahan likhna pasand tha. Nadi ka behta paani, jaise kahaniyan behti hain. Kabhi tez, kabhi dheere. Ek buddhi aurat roz aati thi, nadi se baat karti thi. Azad ne pucha, "Dadi, nadi sunti hai?" Dadi boli, "Haan, sab sunti hai. Tum kaho to sahi."`},{id:14,title:"Khet Ka Geet",tag:"Khet",readTime:"4 min",color:"#D9F99D",content:`Khet gaata hai, agar suno to. Subah 5 baje, jab suraj nahi nikla hota, khet me hal chalta hai. "Charr... charr..." Jaise koi geet ho. Kisan ke pair me mitti, haath me hal, aur muh par geet.

Azad ke baba khet me gaate the, "Sona ugle, sona ugle, dharti sona ugle." Azad ko lagta tha, khet sach me sona ugalta hai, peela peela gehu. Ek baar sukha pada, fasal nahi hui. Baba ne phir bhi geet gaya.`},{id:15,title:"Raat Ka Musafir",tag:"Raat",readTime:"6 min",color:"#CBD5E1",content:`Raat ko musafir akela nahi hota. Ek raat, 11 baje, gaon ki sadak par ek aadmi chal raha tha. Haath me jhola, kandhe par chadar. Koi nahi jaanta tha, kahan se aaya, kahan jaayega.

Azad ne use dekha, chai ki dukaan par. Dukaan band ho rahi thi, par Azad ne kaha, "Kaka, ek chai aur." Musafir ne chai li, bina cheeni ki. Bola, "Raat me cheeni nahi, soch peeni chahiye."

Azad ne pucha, "Kahan ja rahe ho?" Musafir bola, "Jahan raat le jaaye." Dono baat karte rahe. Musafir ne bataya, woh har gaon jaata hai, raat ko, kyunki raat me log sach bolte hain.`},{id:16,title:"School Ki Yaadein",tag:"Yaad",readTime:"4 min",color:"#FDE68A",content:`School ki deewaron par sirf syllabus nahi, yaadein likhi hoti hain. Azad ka school, ek kamra, ek master, aur 20 bacche. Blackboard toota hua, par sapne poore.

Master ji kehte the, "Padhoge likhoge, banoge nawab." Bacche haste the, nawab kaun banta hai gaon me? Par padhte the. Lunch me sabki roti alag, par achar ek dusre ka.`},{id:17,title:"Chidiya Aur Ped",tag:"Prakriti",readTime:"3 min",color:"#BBF7D0",content:`Ped aur chidiya ki dosti sabse purani hai. Ek ped tha, akela, khet ke beech. Us par ek chidiya roz aati, ghosla banaya. Ped ko accha lagta, koi to hai baat karne ko.

Ek din tez aandhi aayi, ghosla gir gaya. Chidiya royi. Ped bola, "Mat ro, phir bana lenge." Chidiya ne phir ghosla banaya, thoda mazboot. Ped ne apni tehni jhuka di, hawa se bachane ko.`},{id:18,title:"Holi Ke Rang",tag:"Holi",readTime:"4 min",color:"#FCA5A5",content:`Holi par gaon ka rang hi alag hota hai. Subah se hi bacche balti leke ghoomte, "Bura na mano, Holi hai." Har ghar se koi na koi bheeg ke nikalta. Azad ko Holi pasand nahi thi, rang se allergy. Par uski maa kehti, "Rang se nahi, dil se khelo."

Ek Holi, usne dekha, ek buddha aadmi akela baitha hai, koi rang nahi lagata. Azad uske paas gaya, bola, "Baba, Holi nahi khelni?" Baba bola, "Khelni hai, par koi khelne wala nahi." Azad ne apne haath me thoda gulal liya, aur baba ke gaal par laga diya.`},{id:19,title:"Diwali Ki Raat",tag:"Diwali",readTime:"5 min",color:"#FDE68A",content:'Diwali ki raat, andhera bhi roshni dhoondta hai. Gaon me bijli kam aati thi, par Diwali par har ghar me diya jalta tha. Tel ka diya, chota sa, par uski roshni me poora aangan jagmag. Azad ki maa har saal 21 diye jalati thi. Azad puchta, "Maa, itne saare kyu?" Maa kehti, "Ek apne liye, baaki sabke liye, jinke ghar me diya nahi."'},{id:20,title:"Azad Aur Chai",tag:"Chai",readTime:"4 min",color:"#FDE68A",content:`Azad ko chai se ishq tha. Har subah chai, sham ko chai, raat ko bhi chai. Log kehte the, itni chai peeyega to neend nahi aayegi. Azad kehta, chai peene ke baad hi to neend aati hai, sapno wali.

Chai ki dukaan par uski ek kursi fix thi. Wahan baith ke woh logon ko dekhta, kahaniyan sunta, aur likhta. Chai thandi ho jaati, par kahani garam rehti.`},{id:21,title:"Bheed Me Tanha",tag:"Sheher",readTime:"5 min",color:"#E9D5FF",content:`Sheher me sabse zyada bheed me hi insan akela hota hai. Azad ne ye pehli baar metro me mehsoos kiya. Charo taraf log, par koi kisi ko nahi dekh raha. Sab apne phone me.

Usne socha, gaon me akela hota tha to sab saath hote the. Sheher me saath hote hue bhi akela hai. Us din usne ek koshish ki, metro me ek aadmi ko dekh ke muskuraya. Aadmi pehle chaunka, phir muskura diya. Dono ne baat nahi ki, par ek pal ke liye bheed kam lagi.`},{id:22,title:"Kagaz Ki Naav",tag:"Bachpan",readTime:"3 min",color:"#BFDBFE",content:`Barish me kagaz ki naav banana ek kala hai. Azad is kala me master tha. Ek kagaz, thoda mod, thoda fold, aur naav taiyaar. Phir usko paani me chhodna, aur dekhna kahan tak jaati hai.

Bachpan me uski naav sabse door jaati thi. Dost kehte, teri naav me jaadu hai. Azad kehta, jaadu kagaz me nahi, soch me hai. Jo door sochta hai, uski naav door jaati hai. Aaj bhi jab barish hoti hai, Azad ek kagaz ki naav banata hai, aur us par likhta hai ek naya khwab.`}],S1=[{id:1,title:"Gaon ki subah \uD83C\uDF3E",author:"@azad_gaon",likes:"12.4k",colorFrom:"#FE9A00",colorTo:"#7C3AED"},{id:2,title:"Bhoot wala ped \uD83D\uDC7B",author:"@kahani_bhoot",likes:"8.9k",colorFrom:"#0F172A",colorTo:"#334155"},{id:3,title:"Chai aur prem ☕❤️",author:"@prem_chai",likes:"22k",colorFrom:"#EC4899",colorTo:"#F59E0B"},{id:4,title:"Pahad bula rahe hain \uD83C\uDFD4️",author:"@pahad_lover",likes:"5.3k",colorFrom:"#10B981",colorTo:"#0E7490"},{id:5,title:"Samandar ke saath",author:"@lehren",likes:"18k",colorFrom:"#06B6D4",colorTo:"#3B82F6"},{id:6,title:"Tracksuit boy \uD83D\uDE0E",author:"@azad_style",likes:"31k",colorFrom:"#111827",colorTo:"#4B5563"}],C1=["Hindi - हिन्दी","English - English","Urdu - اردو","Arabic - العربية","Bengali - বাংলা","Tamil - தமிழ்","Telugu - తెలుగు","Marathi - मराठी","Gujarati - ગુજરાતી","Malayalam - മലയാളം","Kannada - ಕನ್ನಡ","Punjabi - ਪੰਜਾਬੀ","Odia - ଓଡ଼ିଆ","Assamese - অসমীয়া","Spanish - Español","French - Français","German - Deutsch","Portuguese - Português","Russian - Русский","Chinese - 中文","Japanese - 日本語","Korean - 한국어","Turkish - Türkçe","Persian - فارسی","Italian - Italiano","Dutch - Nederlands","Polish - Polski","Swedish - Svenska","Thai - ไทย","Vietnamese - Tiếng Việt","Indonesian - Bahasa","Malay - Melayu","Filipino - Tagalog","Greek - Ελληνικά","Hebrew - עברית","Swahili - Kiswahili","Hausa - Hausa","Amharic - አማርኛ","Somali - Soomaali","Zulu - isiZulu","Afrikaans","Albanian - Shqip","Armenian - Հայերեն","Azerbaijani - Azərbaycanca","Basque - Euskara","Belarusian - Беларуская","Bosnian - Bosanski","Bulgarian - Български","Catalan - Català","Cebuano","Corsican - Corsu","Croatian - Hrvatski","Czech - Čeština","Danish - Dansk","Esperanto","Estonian
