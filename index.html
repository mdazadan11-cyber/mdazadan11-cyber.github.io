    margin-left: 0px;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:w-\[420px\]{
    width: 420px;
  }

  .sm\:w-auto{
    width: auto;
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:text-\[12px\]{
    font-size: 12px;
  }
}

@media (min-width: 768px){
  .md\:static{
    position: static;
  }

  .md\:flex{
    display: flex;
  }

  .md\:hidden{
    display: none;
  }

  .md\:min-h-0{
    min-height: 0px;
  }

  .md\:w-\[320px\]{
    width: 320px;
  }

  .md\:translate-x-0{
    --tw-translate-x: 0px;
    transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-end{
    align-items: flex-end;
  }

  .md\:rounded-\[28px\]{
    border-radius: 28px;
  }

  .md\:border{
    border-width: 1px;
  }

  .md\:bg-\[var\(--bg-soft\)\]{
    background-color: var(--bg-soft);
  }

  .md\:p-10{
    padding: 2.5rem;
  }

  .md\:p-6{
    padding: 1.5rem;
  }

  .md\:px-10{
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }

  .md\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .md\:py-6{
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }
}

@media (min-width: 1024px){
  .lg\:block{
    display: block;
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

चूहा बहुत डर गया और बोला, 'महाराज, मुझे छोड़ दीजिए। कभी मैं आपके काम आऊँगा।' शेर हँसा, पर उसे दया आ गई और छोड़ दिया।

कुछ दिनों बाद शेर शिकारी के जाल में फँस गया। उसकी दहाड़ सुनकर वही चूहा आया और जाल को कुतर कर शेर को आज़ाद कर दिया।

शिक्षा: कभी किसी को छोटा मत समझो।`},{id:"w2",title:"चालाक लोमड़ी",author:"पंचतंत्र",category:"पंचतंत्र",preview:"अंगूर खट्टे हैं - एक भूखी लोमड़ी और ऊँचे अंगूरों की सदाबहार कथा।",content:`एक लोमड़ी बहुत भूखी थी। उसने एक बगीचे में अंगूरों का गुच्छा लटका देखा। वह उछली, पर पहुँच न सकी।

बार-बार कोशिश के बाद भी जब अंगूर हाथ न आए, तो वह बोली, 'ये अंगूर तो खट्टे हैं, मैं क्यों खाऊँ?'

और अकड़ कर चली गई। तब से लोग कहते हैं जब मनचाही चीज़ न मिले तो लोग उसकी बुराई करने लगते हैं।

यह कहानी हमें सिखाती है कि अपनी असफलता को बहाने से मत छिपाओ।`},{id:"w3",title:"दो बैल और शेर",author:"पंचतंत्र",category:"पंचतंत्र",preview:"एकता में बल है। दो मित्र बैलों ने मिलकर जंगल के शेर को भी हराया।",content:`एक जंगल में दो बैल बड़े घनिष्ठ मित्र थे। वे हमेशा साथ चरते, साथ रहते। शेर उन पर हमला करने से डरता था।

एक सियार ने चाल चली और दोनों में फूट डाल दी। अब बैल अलग-अलग चरने लगे।

मौका पाकर शेर ने एक-एक करके दोनों को मार दिया। अंत में सियार भी पछताया।

फूट ही विनाश का कारण है।`},{id:"w4",title:"कछुआ और खरगोश",author:"पंचतंत्र",category:"पंचतंत्र",preview:"धीरे-धीरे चलने वाला कछुआ कैसे घमंडी खरगोश को हराता है।",content:`खरगोश को अपनी तेज़ चाल पर बहुत घमंड था। कछुए ने उसे दौड़ की चुनौती दी।

दौड़ शुरू हुई। खरगोश तेज़ भागा और आगे निकल कर सो गया, सोचा कछुआ तो बहुत पीछे है।

कछुआ धीरे-धीरे चलता रहा और बिना रुके लक्ष्य तक पहुँच गया। खरगोश की नींद खुली तो बहुत देर हो चुकी थी।

निरंतर परिश्रम घमंड से बड़ा है।`},{id:"w5",title:"पूस की रात",author:"प्रेमचंद",category:"प्रेमचंद",preview:"कड़ाके की ठंड में हल्कू और उसके खेत की रखवाली की मार्मिक कहानी।",content:`पूस की अँधेरी रात, कड़ाके की ठंड। हल्कू अपने खेत में मचान पर बैठा थर-थर काँप रहा है।

उसका कुत्ता जबरा भी ठंड से सिकुड़ा है। नीचे नीलगायों का झुंड खेत चर रहा है। हल्कू हिम्मत करके हाँक लगाता है पर ठंड में शरीर साथ नहीं देता।

सुबह जब वह उठता है, पूरा खेत उजड़ा पड़ा है। पर उसे एक अजीब संतोष है - आज वह ठंड में सोया नहीं, जागा है।

प्रेमचंद की यह कहानी गरीब किसान के संघर्ष और उसकी निश्चल आत्मा का चित्र है।`},{id:"w6",title:"ईदगाह",author:"प्रेमचंद",category:"प्रेमचंद",preview:"चार साल के हामिद की ईद और उसकी दादी के लिए चिमटा लाने की दिल छूने वाली कथा।",content:`ईद का दिन। सभी बच्चे नए कपड़े पहन कर ईदगाह जा रहे हैं। हामिद के पास केवल तीन पैसे हैं।

मेले में सब खिलौने, मिठाइयाँ खरीद रहे हैं। हामिद सब देखता है पर लेता कुछ नहीं। आखिर वह एक लोहे की दुकान पर रुकता है।

तीन पैसे में वह अपनी दादी के लिए चिमटा खरीदता है, क्योंकि रोटी सेंकते वक्त उसकी उँगलियाँ जल जाती हैं।

जब सब उसका मज़ाक उड़ाते हैं, दादी की आँखों में आँसू और गर्व दोनों हैं। प्रेम, त्याग की सबसे सुंदर कहानी।`},{id:"w7",title:"कफन",author:"प्रेमचंद",category:"प्रेमचंद",preview:"घीसू और माधव की अमानवीय गरीबी और संवेदनहीनता की कठोर वास्तविकता।",content:`घीसू और उसका बेटा माधव आलसी और कामचोर हैं। घीसू की बहू बुधिया प्रसव पीड़ा से तड़प रही है, पर दोनों बाहर अलाव ताप रहे हैं।

बुधिया मर जाती है। कफन के लिए गाँव से पैसे इकट्ठा होते हैं। पर दोनों पिता-पुत्र उन पैसों से शराब और पूड़ियाँ खा लेते हैं।

नशे में वे कहते हैं, 'कफन तो आखिर जलेगा ही, तो क्यों न आत्मा को शांति मिले?'
