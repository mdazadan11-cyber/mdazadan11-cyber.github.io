
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>AZAD CHAT</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#020617;color:#fff;height:100dvh}.app{max-width:430px;margin:0 auto;height:100dvh;background:#0f172a;display:flex;flex-direction:column}
.top{padding:10px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;gap:6px;overflow:auto}
.top select{background:#020617;color:#fff;border:1px solid #334155;border-radius:20px;padding:8px 12px;font-size:11px}
.banner{margin:10px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#0A84FF,#0050b3)}
.chat{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#020617}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:13px}.other{background:#1e293b;align-self:flex-start}.me{background:#0A84FF;align-self:flex-end}
.input{padding:10px;border-top:1px solid #1e293b;display:flex;gap:8px;background:#0f172a}
.input input{flex:1;background:#020617;border:1px solid #334155;border-radius:20px;padding:8px 14px;color:#fff}
</style></head><body><div class="app">
<div class="top">
<select id="country"><option>🌍 All Countries (195)</option><option>🇸🇦 Saudi Arabia</option><option>🇮🇳 India</option><option>🇵🇰 Pakistan</option><option>🇧🇩 Bangladesh</option><option>🇦🇪 UAE</option><option>🇺🇸 USA</option><option>🇬🇧 UK</option><option>🇳🇵 Nepal</option><option>🇦🇫 Afghanistan</option><option>🇮🇷 Iran</option><option>🇹🇷 Turkey</option><option>🇪🇬 Egypt</option><option>🇩🇪 Germany</option><option>🇫🇷 France</option></select>
<select id="lang"><option>🌐 100 Languages</option><option>हिंदी - Hindi</option><option>English</option><option>اردو - Urdu</option><option>العربية - Arabic</option><option>বাংলা - Bengali</option><option>नेपाली - Nepali</option><option>Español</option><option>Français</option><option>Deutsch</option><option>Türkçe</option></select>
<select id="cont"><option>Continue...</option><option>WhatsApp MSG</option><option>Oil Guide</option><option>Engine Help</option><option>Pension Help</option></select>
</div>
<div class="banner"><b>🤖 Azad AI - 195 Country - 100 Language</b><br><small>Top pe Country + Language + Continue - Sab upar dal diya!</small></div>
<div class="chat"><div class="bub other">Bhai country selector upar laga diya? 🇸🇦🇮🇳</div><div class="bub me">Haan bhai, upar hi hai - 195 Country + 100 Language ✓✓</div></div>
<div class="input"><input placeholder="Message... 100 भाषा me"><button style="background:#0A84FF;border:none;border-radius:50%;width:36px;height:36px;color:#fff">➤</button></div>
</div></body></html>
