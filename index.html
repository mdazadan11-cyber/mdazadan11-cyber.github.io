<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4K VR Media & Books Super App</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .app-bar { background-color: #111; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .vr-btn { color: #ffc107; cursor: pointer; background: none; border: none; font-size: 24px; }
        .screen-container { flex: 1; overflow-y: auto; display: none; padding: 20px; height: calc(100vh - 130px); }
        .screen-container.active { display: block; }
        .player-view { height: 60%; background-color: #1a1a1a; border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 15px; border: 1px solid rgba(255,193,7,0.2); }
        .vr-mode-active { display: flex; width: 100%; height: 100%; }
        .vr-lens { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #ffc107; background: #1a1a1a; font-size: 12px; color: #aaa; }
        .controls { text-align: center; padding: 10px; }
        .controls button { background: none; border: none; color: white; font-size: 40px; margin: 0 15px; cursor: pointer; }
        .controls .play-btn { color: #ffc107; font-size: 55px; }
        .card { background: #222; padding: 15px; margin-bottom: 12px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; }
        .card i { font-size: 35px; margin-right: 15px; }
        textarea { width: 100%; height: 120px; background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; font-size: 16px; resize: none; }
        .save-btn { background: #673ab7; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 10px; cursor: pointer; font-size: 16px; }
        .story-list { margin-top: 20px; }
        .story-item { background: #111; border-left: 4px solid #ffc107; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .reels-container { height: 100%; scroll-snap-type: y mandatory; overflow-y: scroll; }
        .reel-video { height: calc(100vh - 140px); scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; border-bottom: 2px solid #222; }
        .bottom-nav { background-color: #111; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; font-size: 12px; background: none; border: none; }
        .nav-item.active { color: #ffc107; }
        .nav-item i { font-size: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="app-bar">
        <span id="app-title">🎬 4K VR Player</span>
        <button class="vr-btn" id="vr-toggle-btn" onclick="toggleVR()"><i class="material-icons">vr_pane</i></button>
    </div>

    <!-- 1. Player -->
    <div id="screen-player" class="screen-container active" style="padding: 10px;">
        <div class="player-view" id="player-display">
            <div style="text-align:center; color:#555;">
                <i class="material-icons" style="font-size:70px;">movie_creation</i>
                <p style="font-size:11px; margin-top:10px; color:#4caf50;">HARDWARE ACCELERATION ACTIVE (10GB+ 4K UHD)</p>
            </div>
        </div>
        <p style="text-align:center; font-size:12px; color:#aaa; font-family:monospace; margin-bottom:10px;">
            फ़ाइल: 4K_SciFi_Movie_10GB.mp4
        </p>
        <div class="controls">
            <button class="material-icons">replay_10</button>
            <button class="material-icons play-btn">play_circle_filled</button>
            <button class="material-icons">forward_10</button>
        </div>
    </div>

    <!-- 2. Books -->
    <div id="screen-books" class="screen-container">
        <div class="card" onclick="alert('पवित्र कुरान खुल रहा है...')">
            <i class="material-icons" style="color:#4caf50;">book</i>
            <div>
                <h3>पवित्र कुरान (Holy Quran)</h3>
                <p style="color:#888; font-size:14px;">अनुवाद के साथ पढ़ें</p>
            </div>
        </div>
        <div class="card" onclick="alert('श्रीमद्भगवद्गीता खुल रही है...')">
            <i class="material-icons" style="color:#ff9800;">book</i>
            <div>
                <h3>श्रीमद्भगवद्गीता (Bhagavad Gita)</h3>
                <p style="color:#888; font-size:14px;">हिंदी अर्थ के साथ पढ़ें</p>
            </div>
        </div>
    </div>

    <!-- 3. Diary -->
    <div id="screen-diary" class="screen-container">
        <textarea id="story-input" placeholder="अपनी नई कहानी यहाँ लिखें..."></textarea>
        <button class="save-btn" onclick="saveStory()">कहानी फोल्डर में सेव करें</button>
        <div class="story-list">
            <div id="stories-display"></div>
        </div>
    </div>

    <!-- 4. Reels -->
    <div id="screen-reels" class="screen-container" style="padding:0;">
        <div class="reels-container">
            <div class="reel-video"><p style="color:#aaa;">शॉर्ट वीडियो #1 (ऊपर स्क्रॉल करें)</p></div>
            <div class="reel-video"><p style="color:#aaa;">शॉर्ट वीडियो #2</p></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab(0, '🎬 4K VR Player')"><i class="material-icons">play_circle_filled</i><span>4K VR प्लेयर</span></button>
        <button class="nav-item" onclick="switchTab(1, '📖 पवित्र ग्रंथ')"><i class="material-icons">menu_book</i><span>किताबें</span></button>
        <button class="nav-item" onclick="switchTab(2, '✍️ कहानी डायरी')"><i class="material-icons">edit_note</i><span>कहानी डायरी</span></button>
        <button class="nav-item" onclick="switchTab(3, '📱 शॉर्ट्स')"><i class="material-icons">slideshow</i><span>शॉर्ट्स</span></button>
    </div>

    <script>
        let isVRMode = false;
        const screens = ['screen-player', 'screen-books', 'screen-diary', 'screen-reels'];
        const stories = [];
        function switchTab(index, title) {
            screens.forEach((id, idx) => {
                document.getElementById(id).classList.toggle('active', idx === index);
                document.querySelectorAll('.nav-item')[idx].classList.toggle('active', idx === index);
            });
            document.getElementById('app-title').innerText = title;
        }
        function toggleVR() {
            isVRMode = !isVRMode;
            const display = document.getElementById('player-display');
            if (isVRMode) {
                display.innerHTML = `<div class="vr-mode-active"><div class="vr-lens">Left Eye (360° VR)</div><div class="vr-lens">Right Eye (360° VR)</div></div>`;
            } else {
                display.innerHTML = `<div style="text-align:center; color:#555;"><i class="material-icons" style="font-size:70px;">movie_creation</i><p style="color:#4caf50;">HARDWARE ACCELERATION ACTIVE</p></div>`;
            }
        }
        function saveStory() {
            const input = document.getElementById('story-input');
            if (input.value.trim() !== "") {
                stories.push(input.value);
                input.value = "";
                document.getElementById('stories-display').innerHTML = stories.map((s, i) => `<div class="story-item"><p style="color:#ffc107;">कहानी #${i+1}</p><p>${s}</p></div>`).join('');
            }
        }
    </script>
</body>
</html>
