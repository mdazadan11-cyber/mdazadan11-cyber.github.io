<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAIN Hub - 4K VR Media & Books</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;background:#fff;color:#000;font-family:system-ui}
.top{height:56px;background:#fff;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.yt{color:#ff0000;font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px}
.yt span{width:28px;height:20px;background:#ff0000;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:12px}
.search{margin:10px;background:#f1f1f1;border-radius:20px;padding:10px 14px;display:flex;gap:8px}
.search input{border:0;background:transparent;width:100%;outline:none}
.chips{display:flex;gap:8px;padding:8px 12px;overflow:auto}
.chips span{padding:6px 12px;background:#f1f1f1;border-radius:16px;white-space:nowrap;font-size:13px}
.chips span.active{background:#000;color:#fff}
.icons{display:flex;gap:12px;padding:12px;overflow:auto}
.icons div{text-align:center;font-size:11px;min-width:60px}
.icons div i{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:4px}
.btn{display:block;width:92%;margin:12px 4%;padding:16px;background:#ff0000;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700}
.card{margin:12px;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card video,.card iframe{width:100%;height:200px;background:#000;border:0}
.card .info{padding:10px;font-size:13px}
.label{position:absolute;left:0;top:0;bottom:0;width:24px;background:#000;color:#fff;writing-mode:vertical-rl;display:grid;place-items:center;font-size:10px;letter-spacing:2px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:10}
.bottom span{text-align:center;font-size:11px}
.bottom span.active{color:#ff0000}
</style>
</head>
<body>
<div class="top">
<div class="yt"><span>▶</span> YouTube <small style="color:#000;font-weight:400;margin-left:4px">MAIN</small></div>
<div style="margin-left:auto;font-size:13px">Azad - mdazadan11</div>
</div>

<div class="search">🔍 <input id="q" placeholder="Url खोजें या दर्ज करें" onkeydown="if(event.key==='Enter'){window.open('https://www.google.com/search?q='+this.value,'_blank')}"></div>

<div class="chips"><span>बॉक्सिंग</span><span class="active">All</span><span>सभी</span><span>संगीत</span><span>लाइव</span><span>गेमिंग</span></div>

<div class="icons">
<div><i style="background:#ff0000;color:#fff">▶️</i>Youtube</div>
<div><i style="background:#25D366;color:#fff">💬</i>WhatsApp</div>
<div><i style="background:#1877F2;color:#fff">f</i>Facebook</div>
<div><i style="background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff">📸</i>Instagram</div>
<div><i style="background:#eee">🌐</i>Sites</div>
</div>

<button class="btn" onclick="document.getElementById('gal').click()">📁 गैलरी से वीडियो चुनें</button>
<input type="file" id="gal" accept="video/*" multiple style="display:none">

<div id="feed">
<div class="card" style="position:relative">
<div class="label">HD FULL VIDEO</div>
<div style="margin-left:24px">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
<div class="info"><b>Dard E Ishq - AUDIO</b><br><small>90's Old Hindi Songs | Udit Narayan</small></div>
</div>
</div>

<div class="card" style="position:relative">
<div class="label">HD FULL VIDEO</div>
<div style="margin-left:24px">
<iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe>
<div class="info"><b>AFGHAN JALEBI (YA BABA) - PHANTOM</b><br><small>Full Video Song</small></div>
</div>
</div>
</div>

<button class="btn" style="background:#000" onclick="window.open('https://m.youtube.com','_blank')">🔴 YouTube खोलें - पूरा चलेगा</button>

<div style="height:80px"></div>
<div class="bottom"><span class="active">🏠<br>होम</span><span>🎵<br>संगीत</span><span>⬇️<br>डाउनलोड</span><span>👤<br>प्रोफाइल</span></div>

<script>
document.getElementById('gal').addEventListener('change', function(){
  const files = this.files;
  for(let f of files){
    const url = URL.createObjectURL(f);
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = '<video src="'+url+'" controls playsinline></video><div class="info"><b>✅ '+f.name+'</b><br><small>गैलरी से - '+(f.size/1024/1024).toFixed(1)+' MB</small></div>';
    document.getElementById('feed').prepend(div);
  }
  if(files.length) alert('✅ '+files.length+' फाइल जोड़ दी');
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}
</script>
</body>
</html>
