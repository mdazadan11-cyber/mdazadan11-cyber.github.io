
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azad Assistant - Jeb Wala AI</title>
</head>
<body style="background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;padding:20px">
<h2 style="color:#a78bfa">Azad Assistant 🤖</h2>
<p id="status">Haan bhai, sun raha hoon - bolo kya kaam hai</p>
<button id="micBtn" style="width:140px;height:140px;border-radius:50%;background:#7c3aed;color:#fff;font-size:40px;border:none;margin:20px">🎤</button>
<p id="micText" style="color:#888">Mic pe tap kar - Allow aayega</p>
<div id="transcript" style="background:#1a1a1a;padding:16px;border-radius:12px;text-align:left;max-width:400px;margin:20px auto;min-height:100px">
<div>Main Azad Assistant - bol kya kaam hai?</div>
</div>
<input id="textInput" placeholder="Yahan likh agar mic na sune" style="width:70%;padding:12px;border-radius:20px">
<button onclick="sendText()" style="padding:12px 20px;border-radius:20px;background:#7c3aed;color:#fff;border:none">Bhej</button>
<script>
const micBtn=document.getElementById('micBtn');
const status=document.getElementById('status');
const transcript=document.getElementById('transcript');
let recognition,isListening=false;
async function askMicPermission(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());
    status.textContent='Mic Allow ho gaya bhai - ab bol';
    return true;
  }catch(e){
    status.textContent='Bhai Mic Block hai - upar 🔒 pe tap karke Allow kar';
    alert('Upar 🔒 Lock icon > Site settings > Microphone > Allow kar');
    return false;
  }
}
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='hi-IN';
  recognition.interimResults=true;
  recognition.onstart=()=>{isListening=true;micBtn.style.background='red';status.textContent='Sun raha hoon bhai... bolo';}
  recognition.onend=()=>{isListening=false;micBtn.style.background='#7c3aed';}
  recognition.onresult=(e)=>{
    const txt=e.results[0][0].transcript;
    if(e.results[0].isFinal){addBubble(txt,'user');handleCommand(txt);}
  }
}
micBtn.onclick=async()=>{
  const ok=await askMicPermission();
  if(!ok) return;
  if(isListening) recognition.stop();
  else recognition.start();
};
function addBubble(t,who){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.margin='8px 0';d.style.padding='10px';d.style.borderRadius='12px';
  d.style.background=who=='user'?'#7c3aed':'#262626';
  transcript.appendChild(d);
}
function speak(t){
  addBubble(t,'ai');
  const u=new SpeechSynthesisUtterance(t);
  u.lang='hi-IN';speechSynthesis.speak(u);
}
function handleCommand(c){
  c=c.toLowerCase();
  if(c.includes('time')) speak('Time ho raha hai '+new Date().toLocaleTimeString());
  else if(c.includes('photo')) speak('Beti ki photo dikha raha hoon');
  else if(c.includes('gaana')){speak('Gaana baja raha hoon');window.open('https://www.youtube.com/results?search_query='+c,'_blank');}
  else if(c.includes('call')){speak('Call laga raha hoon');window.location.href='tel:';}
  else speak('Samajh gaya bhai '+c+' kar raha hoon');
}
function sendText(){
  const v=document.getElementById('textInput').value;
  if(!v) return;addBubble(v,'user');handleCommand(v);
  document.getElementById('textInput').value='';
}
</script>
</body>
</html>
