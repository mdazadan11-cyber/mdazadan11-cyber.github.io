<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JarvisPK FIXED - Bolne Wala</title>
<style>
body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:15px}
.header{background:linear-gradient(90deg,#6200EE,#9C27B0);padding:18px;border-radius:14px;text-align:center}
.card{background:#1a1a24;border:1px solid #6200EE77;border-radius:12px;padding:14px;margin:12px 0}
.btn{width:100%;padding:15px;margin:5px 0;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}
.btn-purple{background:#6200EE;color:#fff}
.btn-green{background:#00C853;color:#fff;font-size:22px}
.btn-red{background:#D50000;color:#fff}
.status{background:#000;border-radius:10px;padding:14px;min-height:90px;font-size:18px;border-left:4px solid #6200EE;white-space:pre-wrap}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #6200EE;background:#000;color:#fff;margin:6px 0}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="header"><h1>🤖 JARVIS PK - FIXED</h1><p>Ab Bolega 100% - Check Karo</p></div>

<div class="card">
<div class="status" id="status">Ready Bhai!
1. Neeche TEST button dabao - bolega to speaker sahi hai
2. Fir START dabao - mic permission Allow karo</div>
</div>

<div class="card">
<button class="btn btn-purple" onclick="testSpeak()">🔊 TEST - Bolke Dikha</button>
<p class="small">Ye dabao - agar bola to awaz sahi hai</p>
</div>

<div class="card">
<button class="btn btn-purple" onclick="setVoice('female')">👩 AURAT Voice</button>
<button class="btn btn-purple" onclick="setVoice('male')">👨 AADMI Voice</button>
<p id="voiceMode">Aurat Mode</p>
</div>

<div class="card">
<input type="time" id="namazTime" value="05:00">
<button class="btn btn-purple" onclick="saveTime()">Namaz Time Save</button>
<p id="namazShow"></p>
</div>

<div class="card">
<input type="text" id="apiKey" placeholder="Gemini API Key (optional)">
<button class="btn btn-purple" onclick="saveKey()">Save Key</button>
</div>

<div class="card">
<button class="btn btn-green" id="startBtn" onclick="startJarvis()">🔥 START JARVIS</button>
<button class="btn btn-red" onclick="stopJarvis()">STOP</button>
<p id="listening">Band Hai</p>
<p class="small" id="heardLog"></p>
</div>

<script>
let isFemale=true, recog, tts=window.speechSynthesis, running=false, apiKey=localStorage.getItem('jarvis_api')||'';
document.getElementById('apiKey').value=apiKey;
document.getElementById('namazTime').value=localStorage.getItem('namazTime')||'05:00';
document.getElementById('namazShow').innerText='Saved: '+(localStorage.getItem('namazTime')||'05:00');

let voices=[];
function loadVoices(){voices=tts.getVoices();}
tts.onvoiceschanged=loadVoices;
loadVoices();

function testSpeak(){
  speak('Haan bhai test ho gaya, awaz aa rahi hai, ab start dabao');
}
function setVoice(t){isFemale=(t==='female');localStorage.setItem('v',t);document.getElementById('voiceMode').innerText=t; speak(t==='female'?'Aurat mode on':'Aadmi mode on');}
function saveTime(){let v=document.getElementById('namazTime').value;localStorage.setItem('namazTime',v);document.getElementById('namazShow').innerText='Saved: '+v; speak('Namaz time '+v+' save ho gaya');}
function saveKey(){apiKey=document.getElementById('apiKey').value;localStorage.setItem('jarvis_api',apiKey); speak('Key save ho gayi');}

function speak(txt){
  tts.cancel();
  let u=new SpeechSynthesisUtterance(txt);
  u.lang='hi-IN';
  u.rate=0.9;
  u.pitch=isFemale?1.3:0.8;
  if(voices.length){
    let hv=voices.find(v=>v.lang.includes('hi'))||voices.find(v=>v.lang.includes('en-IN'))||voices[0];
    if(hv) u.voice=hv;
  }
  document.getElementById('status').innerText=txt;
  tts.speak(u);
}

function startJarvis(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Chrome me kholo bhai, ye browser mic support nahi karta'); return;}
  running=true;
  document.getElementById('listening').innerText='Sun Raha Hai... Bolo Hey Jarvis';
  document.getElementById('startBtn').innerText='✅ CHAL RAHA HAI';
  speak('Jarvis start ho gaya sir, bolo hey jarvis');
  startRecog();
}
function startRecog(){
  if(!running) return;
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();
  recog.lang='hi-IN';
  recog.continuous=false;
  recog.interimResults=false;
  recog.maxAlternatives=1;
  recog.onstart=()=>{document.getElementById('heardLog').innerText='Mic ON... bolo';};
  recog.onresult=(e)=>{
    let heard=e.results[0][0].transcript;
    document.getElementById('heardLog').innerText='Suna: '+heard;
    handle(heard.toLowerCase());
  };
  recog.onerror=(e)=>{
    document.getElementById('heardLog').innerText='Error: '+e.error+' - restart';
    setTimeout(()=>{if(running) startRecog()},800);
  };
  recog.onend=()=>{ if(running) setTimeout(()=>startRecog(),400); };
  try{recog.start();}catch(err){ setTimeout(()=>{if(running) startRecog()},1000); }
}
async function handle(h){
  let reply='';
  if(h.includes('haal')) reply='Sab badhiya hai sir, aap batao';
  else if(h.includes('namaz')) reply='Namaz ka time '+ (localStorage.getItem('namazTime')||'5 baje') +' hai sir';
  else if(h.includes('khana')) reply='Khana kha lijiye sir';
  else if(h.includes('kaam')||h.includes('kaha')) reply='Haan sir bolo kaha jana hai';
  else if(h.includes('jarvis')||h.includes('bhai')||h.includes('hey')||h.includes('suno')) reply='Haan sir bolo, main sun raha hu, kya kaam hai? Bina mic dabaye jawab de raha hu';
  else reply='Haan sir bolo, main sun raha hu, aapne bola '+h;
  
  // Real AI if key present
  if(apiKey && apiKey.length>10 && (h.includes('jarvis')||h.includes('bhai'))){
    try{
      let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:h+' Reply in short Hindi-Urdu mix like Jarvis, helpful.'}]}]})});
      let d=await r.json();
      let t=d.candidates?.[0]?.content?.parts?.[0]?.text;
      if(t) reply=t;
    }catch(e){}
  }
  speak(reply);
}
function stopJarvis(){running=false; if(recog) try{recog.stop()}catch(e){} tts.cancel(); document.getElementById('listening').innerText='Band Hai'; document.getElementById('startBtn').innerText='🔥 START JARVIS';}
</script>
</body>
</html>
