न टाइम टेबल में नहीं थी...",full:"मुंबई की आखिरी लोकल 1:32 की है, पर आज़ाद ने 2:17 की ट्रेन देखी। खाली प्लेटफॉर्म, अजीब सी आवाज़। ट्रेन आई, दरवाजे खुले, अंदर सब सो रहे थे। आज़ाद चढ़ गया। ट्रेन चली, पर स्टेशन नहीं आ रहे थे। एक बूढ़ा जागा, बोला, 'तुम जिंदा हो, यहाँ क्यों आए?' आज़ाद ने कहा, 'मुझे घर जाना है।' बूढ़ा हँसा, 'ये ट्रेन घर नहीं, यादों में ले जाती है।' खिड़की से बाहर आज़ाद ने अपना बचपन देखा, अपनी माँ को, अपने पहले प्यार को। सब कुछ जो छूट गया था। बूढ़े ने कहा, 'उतरना है तो अगला स्टेशन तुम्हारा है, पर याद रखना, जो इस ट्रेन में एक बार चढ़ता है, वो हर रात इसका इंतज़ार करता है।' आज़ाद अगले स्टेशन पर उतरा, सुबह के 4 बज रहे थे। प्लेटफॉर्म पर कोई ट्रेन नहीं थी, सिर्फ उसके हाथ में एक टिकट था - '2:17, एक तरफा'। आज भी वो रात को प्लेटफॉर्म पर जाता है, उस ट्रेन के इंतज़ार में।"},{id:4,title:"कबाड़ीवाले का खजाना",category:"प्रेरणा",preview:"कचरे में उसे करोड़ों का खजाना मिला, पर उसने...",full:"सलीम कबाड़ी हर घर का कचरा लेता था। एक दिन एक बंगले से उसे एक पुराना बक्सा मिला, ताला लगा हुआ। मालिक ने कहा, 'फेंक दे।' सलीम ने बक्सा खोला, अंदर पुराने खत, फोटो, और एक डायरी। डायरी एक फौजी की थी, 1971 की जंग की। आखिरी पन्ने पर लिखा था, 'मेरा मेडल मेरे बेटे को दे देना'। सलीम ने 3 महीने तक उस फौजी के परिवार को ढूंढा। आखिर में एक बूढ़ी माँ मिली, आँखों में इंतज़ार। सलीम ने मेडल दिया, माँ रो पड़ी, 'मेरा बेटा शहीद हो गया था, 50 साल से इस मेडल का इंतज़ार था।' सलीम ने कहा, 'अम्मा, कचरा नहीं, कहानियाँ उठाता हूँ मैं।' उस दिन के बाद सलीम को लोग कबाड़ी नहीं, 'कहानीवाला' कहते हैं। उसके ठेले पर अब लिखा है - 'यहाँ कचरा नहीं, यादें खरीदी जाती हैं।' और सच में, कचरे में भी कभी-कभी देश की शान छुपी होती है।"},{id:5,title:"बिना आवाज़ की लोरी",category:"इमोशनल",preview:"वो गूंगी माँ अपने बच्चे को कैसे सुलाती थी...",full:"राधा बोल नहीं सकती थी, पर उसकी लोरी पूरे मोहल्ले में मशहूर थी। वो अपने बच्चे मुन्ना को गोद में लेकर, बस होंठ हिलाती, आँखें बंद करती, और मुन्ना सो जाता। डॉक्टर ने कहा, 'ये कैसे?' राधा ने इशारे में समझाया, 'आवाज़ कानों से नहीं, दिल से सुनाई देती है।' एक दिन मुन्ना बहुत बीमार पड़ा, रो रहा था, दवा असर नहीं कर रही थी। राधा ने उसे छाती से लगाया और वही बिना आवाज़ की लोरी गुनगुनाई। धीरे-धीरे मुन्ना शांत हो गया, सो गया। नर्स ने कहा, 'चमत्कार है।' राधा ने लिखा, 'माँ की लोरी में दर्द नहीं, दवा होती है।' आज मुन्ना बड़ा हो गया है, इंजीनियर है। वो कहता है, 'दुनिया की सबसे अच्छी आवाज़ वो है जो सुनाई नहीं देती, बस महसूस होती है।' और हर रात, वो अपनी माँ की गोद में सिर रखकर वही खामोश लोरी सुनता है।"},{id:6,title:"साइकिल वाला जासूस",category:"मजेदार",preview:"पूरे शहर की खबर रखता था वो साइकिल वाला...",full:"पप्पू साइकिल पर घूम-घूम कर समोसे बेचता था, पर असल में वो मोहल्ले का जासूस था। किसका अफेयर चल रहा है, किसका बेटा फेल हुआ, किसके घर में चोरी हुई - सब पता था उसे। एक दिन एक चोरी हुई, पुलिस आई, कुछ नहीं मिला। पप्पू ने कहा, 'साहब, चोर बाहर का नहीं, अंदर का है।' पुलिस हँसी। पप्पू ने साइकिल की घंटी बजाई और कहा, 'कल जिस घर में चोरी हुई, वहाँ सुबह 5 बजे दूधवाला नहीं आया, क्योंकि उसके साइकिल की हवा निकली हुई थी। मतलब कोई रात में वहाँ था।' पुलिस चौंक गई। चोर पकड़ा गया - वही दूधवाला। तब से पप्पू को 'साइकिल शेरलॉक' कहते हैं। वो कहता है, 'खबरें अखबार में नहीं, गली में मिलती हैं। बस साइकिल धीरे चलानी आनी चाहिए।' आज भी उसकी साइकिल की घंटी सुनते ही सब सतर्क हो जाते हैं।"},{id:7,title:"बारिश में छूटा छाता",category:"रोमांस",preview:"एक छाते ने दो दिलों को जोड़ा...",full:"बारिश तेज़ थी, रिया के पास छाता नहीं था। आज़ाद ने अपना छाता उसकी तरफ बढ़ा दिया। रिया ने कहा, 'और तुम?' आज़ाद भीगते हुए बोला, 'मैं बारिश में भीगना पसंद करता हूँ।' अगले दिन रिया ने छाता लौटाया, साथ में एक चिट्ठी - 'कल तुम भीगे, आज मैं भीगूंगी, छाता घर छोड़ आई हूँ।' दोनों हँस पड़े। फिर हर बारिश में वो जानबूझ कर छाता भूल जाते, एक ही छाते में भीगते। एक दिन बहुत तेज़ बारिश में रिया नहीं आई। आज़ाद घंटों इंतज़ार करता रहा। शाम को पता चला, रिया का ट्रांसफर हो गया है। आज़ाद के हाथ में वही छाता रह गया। 2 साल बाद, उसी बारिश में, उसी जगह, रिया आई, वही छाता लेकर। बोली, 'सुना है तुम अब भी छाता भूल जाते हो?' आज़ाद ने कहा, 'ताकि तुम लौट आओ।' आज उनके घर में एक ही छाता है, कभी नहीं खुलता, क्योंकि अब वो बारिश में साथ भीगते हैं।"},{id:8,title:"नाई की भविष्यवाणी",category:"सस्पेंस",preview:"वो हर कटिंग के साथ भविष्य बताता था...",full:"राम नाई की दुकान पर कटिंग 20 रुपये, भविष्यवाणी फ्री। वो कैंची चलाते हुए कहता, 'बेटा, अगले हफ्ते तेरी नौकरी लगेगी।' और लग जाती। लोग डरने लगे। एक दिन आज़ाद गया, राम ने कहा, 'तू कल नहीं आएगा।' आज़ाद हँसा। अगले दिन सच में वो नहीं जा पाया, बाइक खराब हो गई। आज़ाद ने पूछा, 'कैसे पता चलता है?' राम ने आईना दिखाया, 'मैं बाल नहीं, चेहरा पढ़ता हूँ। तेरे चेहरे पर लिखा है - तू भाग रहा है, खुद से।' आज़ाद चुप हो गया। राम ने कहा, 'कैंची से बाल कटते हैं, पर किस्मत खुद से कटती है।' उस दिन के बाद आज़ाद ने भागना बंद कर दिया। राम नाई आज भी दुकान चलाता है, बोर्ड पर लिखा है - 'यहाँ बाल के साथ-साथ घमंड भी काटा जाता है।' और लोग अब कटिंग से ज्यादा उसकी बातें सुनने जाते हैं।"},{id:9,title:"खाली डिब्बा",category:"इमोशनल",preview:"माँ हर साल एक खाली डिब्बा क्यों रखती थी...",full:"माँ हर दिवाली पर एक खाली डिब्बा सबसे ऊपर रखती थी। हम पूछते, 'इसमें क्या है?' वो कहती, 'तुम्हारे पापा की हँसी।' पापा 10 साल पहले गुजर गए थे। एक दिन मैंने डिब्बा खोला, सच में खाली था। मैं गुस्सा हुआ, 'माँ, इसमें कुछ नहीं है!' माँ ने डिब्बा कान के पास लगाया, 'सुनो।' मुझे पापा की हँसी सुनाई दी, वही जो बचपन में सुनता था। माँ ने कहा, 'यादें दिखती नहीं, बजती हैं।' उस दिन समझ आया, माँ हर साल उस डिब्बे को क्यों साफ करती थी, क्यों उस पर इत्र लगाती थी। वो डिब्बा नहीं, पापा का कमरा था। आज माँ नहीं है, पर डिब्बा अभी भी है। मैं हर दिवाली उसे खोलता हूँ, और पापा-माँ दोनों की हँसी सुनता हूँ। कुछ डिब्बे खाली नहीं होते, उनमें पूरा घर बसता है।"},{id:10,title:"परीक्षा वाला भूत",category:"मजेदार",preview:"रात को पढ़ते हुए किसने लाइट बंद की...",full:"राहुल रात भर पढ़ रहा था, बोर्ड परीक्षा थी। रात 2 बजे लाइट बंद हो गई। राहुल ने कहा, 'भूत है!' तभी आवाज़ आई, 'भूत नहीं, तेरा बाप हूँ, सो जा।' राहुल ने देखा, पापा खड़े थे। 'इतना पढ़ेगा तो पागल हो जाएगा।' राहुल बोला, 'फेल हो जाऊंगा।' पापा ने कहा, 'फेल होना भूत से डरावना नहीं है, बेटा। फेल होकर भी जिंदगी चलती है, पर बिना सोए नहीं।' राहुल सो गया। सुबह उठा तो पापा ने चाय दी और कहा, 'भूत किताब में नहीं, तेरे दिमाग में है। उसे भगाने के लिए पढ़ना नहीं, सोना पड़ता है।' राहुल पास हो गया, 80% आए। उसने स्टेटस लगाया - 'मेरे घर का भूत सबसे समझदार है, वो मुझे सुलाता है।' तब से हर बच्चा रात को 11 बजे के बाद पढ़ता है तो उसके पापा लाइट बंद कर देते हैं, भूत बनकर।"},{id:11,title:"आखिरी खत",category:"रोमांस",preview:"उसने 100 खत लिखे, पर भेजा एक भी नहीं...",full:"अमन ने नेहा के लिए 100 खत लिखे, कॉलेज के 4 साल में। एक भी नहीं भेजा। नेहा की शादी हो गई। अमन ने सारे खत जला दिए, सिवाय आखिरी के। आखिरी खत में लिखा था, 'तुम्हें पता भी नहीं चलेगा कि किसी ने तुम्हें इतना चाहा, बिना कहे।' 10 साल बाद, नेहा का तलाक हो गया, वो वापस आई। उसे एक पुरानी किताब में वो आखिरी खत मिला, जो अमन ने गलती से उसकी किताब में रख दिया था। नेहा ने अमन को ढूंढा, पूछा, '100 खत क्यों नहीं भेजे?' अमन ने कहा, 'क्योंकि प्यार खत में नहीं, इंतज़ार में होता है।' नेहा रो पड़ी, 'तो अब इंतज़ार खत्म करो।' आज दोनों साथ हैं, और अमन रोज़ एक खत लिखता है, और रोज़ देता है। दीवार पर 100 फ्रेम लगे हैं, खाली, और एक में वो आखिरी खत। अमन कहता है, 'कुछ खत देर से पहुंचते हैं, पर दिल तक जरूर पहुंचते हैं।'"},{id:12,title:"रिक्शे वाला डॉक्टर",category:"प्रेरणा",preview:"वो रिक्शा चलाता था, पर लोग उसे डॉक्टर कहते थे...",full:"करीम रिक्शा चलाता था, पर उसके रिक्शे में हमेशा दवाइयाँ रहती थीं। किसी को बुखार, किसी को चोट, वो फ्री में दवा देता। लोग पूछते, 'तू डॉक्टर है?' वो कहता, 'नहीं, मेरा बेटा डॉक्टर बनना चाहता था, पैसे नहीं थे, मर गया। अब मैं सबका बेटा हूँ।' एक दिन एक साहब को हार्ट अटैक आया, करीम ने CPR दिया, जान बच गई। साहब ने कहा, 'तू रिक्शा क्यों चलाता है, क्लिनिक खोल।' करीम ने कहा, 'क्लिनिक में लोग आएंगे, रिक्शे में मैं लोगों तक जाऊंगा।' साहब ने उसे एक ऑटो दिलाया, उस पर लिखा - 'चलता फिरता दवाखाना'। आज करीम के पास 5 ऑटो हैं, सब में दवा है, सब फ्री। वो कहता है, 'डॉक्टर बनने के लिए डिग्री नहीं, दिल चाहिए।' और सच में, शहर में अब कोई भी बीमार हो तो कहता है, 'करीम को बुलाओ, वो रिक्शे वाला डॉक्टर।'"},{id:13,title:"छत पर उगा पेड़",category:"इमोशनल",preview:"बिना बीज के छत पर पेड़ कैसे उगा...",full:"दादी की छत पर एक पीपल का पेड़ उग आया, बिना किसी ने बीज डाले। लोग कहने लगे, 'अशुभ है, काट दो।' दादी ने मना कर दिया, 'ये मेरा बेटा है।' सब हँसे। दादी रोज़ उसे पानी देती, बातें करती। पेड़ बड़ा हो गया। एक दिन आंधी आई, सारे घरों की छत उड़ गई, सिर्फ दादी का घर बचा, क्योंकि पेड़ ने जड़ से पकड़ रखा था। लोग समझ गए। इंजीनियर ने कहा, 'ये चमत्कार है, बिना मिट्टी के पेड़ ने छत को जकड़ रखा है।' दादी ने कहा, 'चमत्कार नहीं, प्यार है। जिसे तुम कचरा समझते हो, वो कभी-कभी सहारा बनता है।' दादी के जाने के बाद भी पेड़ वहीं है। मोहल्ले के बच्चे उसकी छाँव में खेलते हैं। बोर्ड लगा है - 'यहाँ एक माँ ने पेड़ को बेटा बनाया, और बेटे ने घर को बचाया।' कुछ रिश्ते खून के नहीं, पानी के होते हैं।"},{id:14,title:"जूते वाला आइना",category:"प्रेरणा",preview:"मोची के पास एक आइना था जो भविष्य दिखाता था...",full:"मोची काका के पास एक टूटा आइना था। जो भी जूता सिलवाने आता, काका उसे आइना दिखाते, 'देख, तू कैसा दिखता है।' लोग अपने फटे जूते देखकर शर्मिंदा होते। एक दिन एक अमीर आदमी आया, महंगे जूते, पर घमंड बहुत। काका ने आइना दिखाया, आदमी को अपने जूते नहीं, अपने नंगे पैर दिखे। वो डर गया। काका ने कहा, 'जूते से आदमी नहीं बनता, आदमी से जूता बनता है।' अमीर आदमी ने अपने सारे जूते गरीबों में बाँट दिए। तब से मोची काका का आइना मशहूर हो गया। लोग जूता नहीं, खुद को देखने आते हैं। काका कहते हैं, 'मेरे आइने में जूता साफ दिखता है, पर इंसान और साफ।' आज उनकी दुकान पर लाइन लगती है। बोर्ड पर लिखा है - 'यहाँ जूते के साथ-साथ सोच भी सिली जाती है।' और सच में, टूटा आइना भी कभी-कभी पूरी जिंदगी दिखा देता है।"},{id:15,title:"बस का आखिरी टिकट",category:"सस्पेंस",preview:"कंडक्टर ने कहा - ये टिकट किसी और का है...",full:"रात की आखिरी बस, आज़ाद अकेला। कंडक्टर ने टिकट दिया, पर नाम किसी और का - 'रमेश'। आज़ाद ने कहा, 'मैं आज़ाद हूँ।' कंडक्टर बोला, 'आज से तुम रमेश हो।' बस चली, हर स्टॉप पर कोई न कोई चढ़ता, आज़ाद को 'रमेश' कहकर बुलाता। आज़ाद घबरा गया। आखिरी स्टॉप पर एक बूढ़ी औरत आई, बोली, 'रमेश बेटा, तू आ गया, 5 साल बाद।' आज़ाद ने कहा, 'मैं रमेश नहीं हूँ।' औरत ने उसकी जेब में हाथ डाला, एक फोटो निकाली - रमेश की, जो हूबहू आज़ाद जैसा था। औरत रो पड़ी, 'मेरा बेटा एक्सीडेंट में मर गया था, इसी बस में।' आज़ाद समझ गया, ये बस यादों की है। उसने औरत को गले लगाया, 'आज से मैं ही रमेश हूँ, माँ।' बस वापस मुड़ी, सुबह हो गई। आज़ाद के पास अभी भी वो टिकट है, नाम - रमेश। और हर महीने वो उस बूढ़ी माँ से मिलने जाता है, टिकट लेकर।"},{id:16,title:"किताबों वाला चोर",category:"मजेदार",preview:"वो चोर पैसे नहीं, किताबें चुराता था...",full:"शहर में एक चोर आया, जो सिर्फ लाइब्रेरी से किताबें चुराता था। पुलिस परेशान, लाइब्रेरियन रो रहा था। एक रात चौकीदार ने उसे पकड़ लिया, 10 साल का बच्चा। पूछा, 'क्यों चुराता है?' बच्चा बोला, 'मेरे पास पैसे नहीं, पढ़ना है।' चौकीदार ने उसे लाइब्रेरियन के पास ले जाया। लाइब्रेरियन ने कहा, 'चुराने की जरूरत नहीं, यहीं पढ़ ले।' बच्चे ने कहा, 'घर पर माँ बीमार है, उसे कहानी सुनानी है।' लाइब्रेरियन की आँखें भर आईं। उसने बच्चे को लाइब्रेरी की चाबी दे दी, 'जब मन करे, आ जाना।' आज वो बच्चा बड़ा होकर लेखक बन गया है। उसकी पहली किताब का नाम है - 'किताबों वाला चोर'। पहले पन्ने पर लिखा है - 'उस चौकीदार और लाइब्रेरियन के नाम, जिन्होंने चोर को चोर नहीं, पाठक समझा।' और शहर की लाइब्रेरी में अब एक बोर्ड लगा है - 'यहाँ किताबें चुराना मना नहीं, बस लौटाना मत भूलना।'"},{id:17,title:"सिग्नल पर खड़ा आदमी",category:"इमोशनल",preview:"वो 10 साल से एक ही सिग्नल पर क्यों खड़ा है...",full:"ट्रैफिक सिग्नल पर एक आदमी 10 साल से खड़ा है, हाथ में फूल। लोग कहते हैं पागल है। आज़ाद ने पूछा, 'क्यों खड़े हो?' आदमी ने कहा, 'मेरी बेटी ने कहा था, पापा, मैं सिग्नल क्रॉस करके आऊंगी, फूल ले आना।' वो दिन एक्सीडेंट हो गया, बेटी नहीं आई। आदमी तब से हर दिन फूल लेकर खड़ा है। आज़ाद ने कहा, 'अंकल, वो नहीं आएगी।' आदमी मुस्कुराया, 'पता है, पर अगर मैं नहीं आया तो उसे लगेगा पापा भूल गए।' आज़ाद की आँखें भर आईं। उसने भी फूल लिया और खड़ा हो गया। धीरे-धीरे पूरा शहर वहाँ फूल लेकर खड़ा होने लगा। अब उस सिग्नल पर कोई हॉर्न नहीं बजाता, सब फूल देखते हैं। बोर्ड लगा है - 'यहाँ एक पिता अपनी बेटी का इंतज़ार कर रहा है, 10 साल से।' और लोग अब सिग्नल को सिग्नल नहीं, 'पापा का इंतज़ार' कहते हैं।"},{id:18,title:"आटा चक्की की आवाज़",category:"इमोशनल",preview:"बंद चक्की फिर कैसे चलने लगी...",full:"गाँव की आटा चक्की 5 साल से बंद थी, मालिक मर गया था
