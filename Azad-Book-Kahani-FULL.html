{title:"Chapter 3: Super App ka Khwab",pages:[5,6]}]},rt=[{title:"Gaon se Riyadh Tak",titleAr:"گاؤں سے ریاض تک",content:`Main Azad. Gaon me paida hua, chhota sa ghar tha, ammi abbu ka pyar. 18 saal ka tha jab socha — Riyadh jana hai, bhai log wahan hain. Passport banwaya, visa laga, aur ek din subah 4 baje gaon ki bus pakdi. Dil me dar bhi tha, sapne bhi. Ammi boli 'Beta khayal rakhna'. Main bola 'Ammi tension mat lo, Azad Book Kahani likhunga ek din.'

Riyadh airport pe utra to laga dusri duniya. Garmi 48 degree, par himmat thandi nahi hui. Batha pahucha, Aman Bhai ne room diya. Wahi se kahani shuru.`},{title:"Batha ki Biryani aur Bhai Log",titleAr:"بتھا کی بریانی اور بھائی لوگ",content:`Batha — Riyadh ka dil. Yahan sab desi milte hain. Subah 5 baje chai, sham ko biryani. Sajid Bhai bola 'Azad, idhar kaam tough hai par bhai log saath hain to sab easy.' Hum market me kaam karte, shaam ko reel banate.

Ek din socha — itne apps kyun? WhatsApp alag, TikTok alag, Quran alag, YouTube alag. Kyun na ek hi app me sab ho? Monogram banaya A-Z, matlab Azad Book Kahani se Zaid tak sab bhai. Orange color rakha — himmat ka rang.`},{title:"AZ Monogram — Puran Nishan",titleAr:"اے زیڈ - پران نشان",content:`Log puchte 'AZ ka matlab?' Main bolta — Azad Book Kahani. A se Z tak meri kahani. Purana zamane me kitab pe mohar lagta tha, aise hi maine AZ ka monogram banaya. A bada, Z uske saath joda, beech me ek lakeer — jaise zindagi me utar chadhav.

Is nishan ko dekho to yaad rakho — har bada sapna chhote kadam se shuru hota hai. Riyadh me akele aaya tha, aaj Azad Book Kahani Super App me hazaron bhai jude hain.`},{title:"Super App ka Khwab",titleAr:"سپر ایپ کا خواب",content:`6 cheez ek jagah: CALL — jaise WhatsApp. REEL — jaise TikTok, upar swipe karo. KITAB — Quran, Bible, Gita, aur meri Azad Book Kahani. MOVIE — YouTube same same. MARKET — OLX same same. AI — hukm ka ghulam, bolo 'film dhoondh ke la' to la dega.

Raat raat bhar code likha. Bhai log bolte 'Azad bhai, video call kaam nahi karta'. Ab karta hai! Reel swipe nahi hota tha, ab haath se swipe hota hai, TikTok same same. Yehi to Azad Book Kahani hai — jo kami hai use theek karo, ruko mat.`},{title:"Aakhri Baat — Bhai Chara",titleAr:"آخری بات - بھائی چارہ",content:`Riyadh me seekha — paisa sab kuch nahi, bhai log sab kuch hain. Aman Bhai ne location bheja, Sajid ne number diya, Imran Chacha ne dua di. Mumma roz puchti 'Beta khana kha liya?'

Azad Book Kahani khatam nahi, shuru hai. Har page pe ek nayi kahani. Tum bhi likho apni. Aur haan — Allow Allow Allow karna mat bhoolna, warna app kaise chalega? \uD83D\uDE0A

— Azad Book Kahani, Riyadh, KSA
