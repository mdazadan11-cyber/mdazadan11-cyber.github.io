html,
body,
#root {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/*
 * Tailwind v4's Preflight no longer sets `cursor: pointer` on buttons, so
 * clickable controls fall back to the default arrow cursor. Restore the
 * pointer cursor on interactive elements so artifacts give a clear
 * "this is clickable" affordance on hover.
 */

button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label[for],
select:not(:disabled),
summary {
  cursor: pointer;
}

  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

# Gemini Setup
genai.configure(api_key=GEMINI_API_KEY)
model = genai.GenerativeModel('gemini-1.5-flash')

# Tasker Local URL (optional, agar phone connect nahi hai to ignore hoga)
TASKER_URL = "http://localhost:1821/JarvisAction"

# --- FIX 1: Profanity Filter (Gaali Blocker) ---
BAD_WORDS = ["mc", "bc", "bkl", "chutiya", "madarchod", "behenchod", "laude", "gandu"]

def contains_abuse(text):
    text_lower = text.lower()
    for word in BAD_WORDS:
        if word in text_lower:
            return True
    return False

def speak(text):
    """Jarvis bolta hai + print karta hai"""
    print(f"Jarvis: {text}")
    try:
        requests.post(TASKER_URL, data={'action': 'speak', 'text': text}, timeout=2)
    except:
        pass

def listen_command():
    """ONE-SHOT SUNNA - No Loop, 5 sec timeout"""
    r = sr.Recognizer()
    r.pause_threshold = 1  # FIXED: jaldi rukega
    r.energy_threshold = 4000  # FIXED: shor kam pakdega
    
    with sr.Microphone() as source:
        print("Sun raha hu sir... (5 sec)")
        r.adjust_for_ambient_noise(source, duration=0.5)
        try:
            audio = r.listen(source, timeout=5, phrase_time_limit=6)  # FIXED: one-shot
        except sr.WaitTimeoutError:
            print("Timeout: kuch bola nahi")
            return "none"

    try:
        query = r.recognize_google(audio, language='hi-IN')
        print(f"Sir: {query}")

        # FIX 2: Abuse check - Gemini ko bhejna hi nahi
        if contains_abuse(query):
            speak("Bhai kaam ki baat bolo")
            print("[BLOCKED: Abusive content filtered]")
            return "blocked"  # Gemini ko nahi jayega

        return query.lower()
    except:
        return "none"

def send_to_phone(action_type, target):
    try:
        requests.post(TASKER_URL, json={'action': action_type, 'target': target}, timeout=3)
    except:
        print("Tasker connect nahi hai - phone action skip")

def google_search_tool(query):
    speak(f"Google par '{query}' search kar raha hu sir.")
    search_results = []
    try:
        for url in search(query, num_results=3):
            search_results.append(url)
        return f"Google links: {', '.join(search_results)}"
