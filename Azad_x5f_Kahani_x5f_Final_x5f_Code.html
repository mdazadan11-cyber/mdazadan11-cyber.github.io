"}],["path",{d:"M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1",key:"rd2r6e"}]]);var Wn=T("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var _c=Ae(Nn(),1),lm=Symbol.for("react.element");var um=Object.prototype.hasOwnProperty,om=_c.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,im={key:!0,ref:!0,__self:!0,__source:!0};function Nc(e,n,t){var r,l={},u=null,o=null;t!==void 0&&(u=""+t),n.key!==void 0&&(u=""+n.key),n.ref!==void 0&&(o=n.ref);for(r in n)um.call(n,r)&&!im.hasOwnProperty(r)&&(l[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)l[r]===void 0&&(l[r]=n[r]);return{$$typeof:lm,type:e,key:u,ref:o,props:l,_owner:om.current}}var p=Nc,C=Nc;var am=[{id:1,title:"Gaon Ki Sham",tag:"Gaon",readTime:"5 min",color:"#FDE68A",content:`Gaon ki sham ka rang hi alag hota hai. Suraj jab khet ke peeche chupne lagta hai, to pura aasman narangi ho jata hai. Azad apni cycle leke khet ki med par baitha tha. Uske haath me ek purani kitaab thi.

Baba kehte the, gaon me sham ka matlab hota hai kahani ka samay. Har ghar ke aangan me koi na koi kahani chal rahi hoti hai. Kahi chulhe par roti sek rahi dadi apne pote ko raja-rani ki kahani suna rahi hai, to kahi chaupal par buzurg hukka peete hue apne jawaani ke kisse.

Aaj Azad ne socha, woh bhi ek kahani likhega. Lekin kaisi? Usne aas paas dekha. Ek kutta tha jo roz sham ko usi jagah aake baithta tha, jaise kisi ka intezaar kar raha ho. Ek ped tha, jiska naam kisi ne nahi rakha tha, par sab uske neeche baithte the. Aur ek hawa thi, jo khet se aake seedha dil me utar jaati thi.

Usne likhna shuru kiya. "Ek tha gaon, jahan sham kabhi khatam nahi hoti thi." Likhte likhte raat ho gayi. Taare nikal aaye. Gaon ki auratein geet gaane lagi. Azad ko laga, uski kahani khud-b-khud gaon ki hawa me ghul rahi hai. Tabhi usko samajh aaya, gaon ki sham khud ek kahani hai, jise roz likha jaata hai, par kabhi khatam nahi hota. Woh ghar lauta, aur us raat usne apni pehli poori kahani likhi, sirf gaon ki sham ke naam.`},{id:2,title:"Bhoot Aur Baccha",tag:"Bhoot",readTime:"6 min",color:"#C7D2FE",content:`Bachpan me sabse badi kahani bhoot ki hoti hai. Har gali me ek ghar hota hai jahan koi nahi rehta, aur kehte hain wahan bhoot rehta hai.

Chintu 9 saal ka tha. Uske dost kehte the, purane school ke peeche jo peepal ka ped hai, wahan raat ko bhoot aata hai. Chintu ko dar lagta tha, par usko curiosity bhi thi. Ek din usne socha, dekhega zaroor.

Sham ko woh chupke se peepal ke paas gaya. Wahan sach me andhera tha. Hawa tez chal rahi thi. Patte khadak rahe the. Tabhi usko ek awaaz sunai di, "Kaun hai?"

Chintu ka dil zor se dhadakne laga. Usne himmat karke kaha, "Main Chintu."

Jawab aaya, "Main Bholu. Yahan kyu aaya?"

Ped ke peeche se ek baccha nikla, usi umar ka, par uske kapde purane the. Woh bola, "Sab mujhe bhoot kehte hain, kyunki main yahan akela rehta hoon. Mere maa-baap sheher chale gaye."

Chintu ko samajh aaya, bhoot koi nahi hota. Akela pan bhoot hota hai. Us din se dono dost ban gaye. Ab woh peepal ka ped bhoot ka nahi, dosti ka ped kehlata hai. Chintu ne sabko bataya, dar ki jagah dosti rakhni chahiye. Gaon wale bhi ab wahan shaam ko chai peene jaate hain.`},{id:3,title:"Prem Kahani",tag:"Prem",readTime:"4 min",color:"#FBCFE8",content:`Prem kahani hamesha filmon jaisi nahi hoti. Kabhi kabhi woh sirf ek chai ki dukaan se shuru hoti hai.

Ramesh roz subah 7 baje chai peene aata tha. Sunita usi dukaan par chai banati thi. Na zyada baat, na zyada dekha. Bas ek muskaan. Ramesh ko uski chai me kuch alag lagta tha. Shayad meetha zyada nahi, par ehsaas zyada tha.

Ek din barish ho rahi thi. Dukaan khali thi. Ramesh ne himmat karke kaha, "Tumhari chai me kya daalti ho, jo itni yaad aati hai?"

Sunita hasi, "Intezaar."

Ramesh samjha nahi. Sunita boli, "Main roz sochti thi, tum kab aaoge, isliye chai me intezaar ghul jata hai."

Us din dono ne barish me chai pi, bina kuch kahe. Prem ko shabdon ki zarurat nahi hoti. Kabhi kabhi sirf ek cup chai kaafi hoti hai, do dilon ko milane ke liye. Ramesh ab bhi roz aata hai, par ab do chai banti hai, ek uske liye, ek apne intezaar ke khatam hone ke liye.`},{id:4,title:"Azad Ki Udaan",tag:"Azad",readTime:"5 min",color:"#A7F3D0",content:`Azad ko bachpan se udna tha. Par uske paas pankh nahi the. Uske paas sirf ek sapna tha.

Gaon ke sab log kehte the, "Padh le, khet sambhal, udne se pet nahi bharta." Par Azad ka dil maanta hi nahi tha. Woh roz chhat par jaake patang udata tha, aur sochta tha, ek din main bhi aise udunga.

Ek din usne kagaz se ek hawai jahaz banaya. Us par likha, "Main Azad hoon." Aur use hawa me phenk diya. Jahaz udta hua khet tak gaya. Wahan ek buddha aadmi ne use uthaya aur padha. Woh aadmi hasa aur bola, "Udan pankh se nahi, soch se hoti hai."

Azad ne us din se likhna shuru kiya. Likhna uski udaan ban gaya. Har kahani ek naya aasman thi. Kabhi woh gaon se sheher udta, kabhi sheher se dil tak. Log uski kahaniyan padhne lage. Ek din sheher se ek publisher aaya, bola, "Tumhari udaan ab kitaab banegi."

Aaj Azad ki kitaab har dukaan par hai. Par woh ab bhi chhat par jaake patang udata hai. Kyunki usko pata hai, asli udaan kabhi khatam nahi hoti.`},{id:5,title:"Jungle Ka Raaz",tag:"Jungle",readTime:"7 min",color:"#BBF7D0",content:`Jungle me har ped ek raaz chupata hai. Jo sun sake, wahi samajh sake.

Ek tha lakad-hara, naam tha Bheema. Roz jungle jaata, lakdi kaat ta. Ek din usne ek ajeeb ped dekha, jis par kabhi patte nahi jhadte the. Usne kulhadi uthayi, jaise hi maarne wala tha, ped se awaaz aayi, "Ruk ja."

Bheema dar gaya. Ped bola, "Main 100 saal se yahan hoon. Mujhe kaat dega to jungle ro padega."

Bheema ne kulhadi neeche rakhi. Ped ne kaha, "Tu roz aata hai, par kabhi sunta nahi. Jungle me janwar, hawa, paani sab baat karte hain. Tu bas kaat ta hai."

Us din Bheema bina lakdi ke lauta. Gaon wale hasse. Par dusre din woh phir gaya, par kulhadi nahi le gaya. Bas baitha raha. Dheere dheere usko samajh aaya, jungle saans leta hai. Usne gaon walo ko samjhaya, jungle ko kaatoge to khud kaat jaoge.

Ab Bheema jungle ka rakhwala hai. Woh ped ab bhi wahan hai, hara bhara. Kehte hain, jo uske neeche baithta hai, use jungle ka raaz samajh aa jata hai.`},{id:6,title:"Pahadon Ki Kahani",tag:"Pahad",readTime:"5 min",color:"#E0E7FF",content:`Pahad kabhi bolte nahi, par bahut kuch kehte hain.

Meera pehli baar pahad gayi thi. Sheher ki ladki, shor se tang. Usne socha, pahad par shanti milegi. Par pahad par toh aur bhi bada shor tha, hawa ka, paani ka, chidiyon ka.

Pehle din usko ajeeb laga. Dusre din usko thoda sukoon mila. Teesre din usne pahad se baat karni shuru ki. Boli, "Tum itne bade kaise ho?"

Pahad ne jawab nahi diya, par ek pathar gira. Meera samjhi, bada hone ke liye girna padta hai. Pahad bhi kabhi chote pathar the, judte judte bade bane.

Meera wahan 7 din rahi. Har din ek naya sabak. Kabhi dhundh se seekha ki sab kuch saaf dikhna zaruri nahi, kabhi nadi se seekha ki behti rehna zaruri hai.

Jab woh lauti, to woh wahi nahi thi. Ab woh sheher me bhi pahad dhoond leti thi, chai ki dukaan ke shor me, bus ki bheed me. Kyunki usko samajh aa gaya tha, pahad bahar nahi, andar hota hai.`},{id:7,title:"Samandar Ki Lehren",tag:"Samandar",readTime:"4 min",color:"#BAE6FD",content:`Samandar har roz kinare se kehta hai, aa ja. Par kinara kabhi jaata nahi.

Raju machuara tha. Roz samandar jaata, jaal phenkta. Ek din samandar shant tha, ekdum shant. Raju ne socha, aaj machli nahi milegi. Par usne jaal phenka, aur usme ek chitthi phansi hui mili.

Chitthi par likha tha, "Main lehar hoon, roz aati hoon, roz jaati hoon. Tum kab aaoge?"

Raju hasa, lehar bhi chitthi likhti hai? Usne chitthi ko wapas samandar me phenk diya. Agle din phir ek chitthi, "Tumne jawab nahi diya."

Raju ne is baar jawab likha, "Main kinara hoon, ja nahi sakta."

Lehar ne likha, "Kinara hona matlab rukna nahi, intezaar karna hai."

Raju ko samajh aaya. Woh roz samandar jaata tha machli ke liye, par samandar usko zindagi sikha raha tha. Aana jaana, milna bichadna, sab lehar jaisa hai. Tab se Raju machli kam, chitthi zyada likhne laga, samandar ke naam.`},{id:8,title:"Sheher Ki Roshni",tag:"Sheher",readTime:"5 min",color:"#FEF08A",content:`Sheher ki roshni din me nahi dikhti, raat me chamakti hai.

Aman gaon se sheher aaya tha, naukri ke liye. Gaon me andhera hota tha, taare dikhte the. Sheher me roshni itni thi ki taare dikhte hi nahi the. Pehle usko laga, sheher me sab kuch hai. Dheere dheere usko laga, sheher me sab kuch hai, par sukoon nahi.

Roz office, bus, bheed. Ek din woh chhat par gaya, raat ko. Neeche dekha, gaadiyon ki roshni, dukaanon ki roshni, gharo ki roshni. Itni roshni, phir bhi sab bhaag rahe hain. Gaon me andhera tha, par sab thehre hue the.

Usne apni maa ko phone kiya, "Maa, yahan roshni bahut hai, par neend nahi aati."

Maa boli, "Roshni aankh me nahi, dil me chahiye."

Aman ne agle din apne kamre me ek diya jalaya. Chota sa diya, par uski roshni me usko gaon yaad aa gaya. Ab woh roz diya jalata hai, sheher ki hazaar roshni ke beech, apni ek roshni.`},{id:9,title:"Chai Ki Dukaan",tag:"Chai",readTime:"3 min",color:"#FDE68A",content:`Chai ki dukaan sirf chai nahi bechti, kahaniyan bechti hai.

Har subah 6 baje, dukaan khulti hai. Pehle aate hain akhbaar wale, phir school ke bacche, phir office wale. Har ek ki apni kahani, par chai sabki ek jaisi.

Dukaan wala Ramu kaka sabki kahani sunta hai. Kabhi hasa deta hai, kabhi chup rehta hai. Uski chai me ek jaadu hai, peete hi dil halka ho jata hai.

Ek din ek aadmi aaya, bahut pareshan. Bola, "Kaka, zindagi samajh nahi aati." Kaka ne chai di, bola, "Chai jaise hai zindagi, kadvi bhi, meethi bhi, garam bhi, thandi bhi. Bas peete rehna hai."

Aadmi ne chai pi, aur muskuraya. Tab se roz aata hai. Chai ki dukaan ab bhi wahi hai, choti si, par usme poora sheher baithta hai, ek cup me.`},{id:10,title:"Purana Kua",tag:"Raaz",readTime:"6 min",color:"#DDD6FE",content:`Gaon me ek purana kua tha, jiska paani kabhi khatam nahi hota tha. Kehte the, usme ek ichha poori karne wala patthar hai.

Sab usme sikka phenkte the. Azad ne bhi ek sikka phenka, aur manga, "Mujhe kahani likhna aaye."

Kue se awaaz aayi, "Kahani paani jaisi hai, andar se aati hai."

Azad samjha nahi. Roz kue par jaane laga. Ek din usne andar jhanka, to apna hi aks dekha. Tab samajh aaya, kua khali nahi, bhara hua hai, humse hi.

Usne kue ke paas baithna shuru kiya, logon ki baatein sunna, hawa ko mehsoos karna. Dheere dheere kahaniyan khud aane lagi. Kua ab bhi wahan hai, paani ab bhi hai, par ab log sikka nahi, kahani phenkte hain usme.`},{id:11,title:"Cycle Wala Dost",tag:"Dosti",readTime:"4 min",color:"#FED7AA",content:`Dosti kabhi kabhi ek cycle se shuru hoti hai.

Sonu ke paas nayi cycle thi, Monu ke paas nahi. Sonu roz Monu ke ghar ke saamne se nikalta, ghanti bajata. Monu dekhta rehta.

Ek din Sonu ne kaha, "Chal, saath ghoomte hain, tu peeche baith."

Monu peeche baitha, dono pure gaon ghoome. Tab se roz ka niyam ban gaya. Aage Sonu, peeche Monu. Kabhi kabhi Monu aage, Sonu peeche.

Log kehte, cycle ek hai, dost do. Par dost kehte, dost ek hai, cycle to bahana hai.

Bade hue, sheher chale gaye, cycle toot gayi, par dosti ab bhi wahi hai. Ab bhi jab milte hain, to ek hi cycle par baithne ka mann karta hai.`},{id:12,title:"Barish Ka Pehla Din",tag:"Barish",readTime:"4 min",color:"#BFDBFE",content:`Barish ka pehla din hamesha yaad rehta hai.

Garmi se jale hue khet, sookhe hue ped, sab intezaar me the. Aasman kaala hua, hawa chali, aur pehli boond giri. Bacche bhaagne lage, "Barish aayi, barish aayi."

Azad kitaab band karke bahar aaya. Mitti ki khushboo, aisi khushboo jo sirf pehli barish me aati hai. Usne haath aage kiya, boond hatheli par giri, thandi.

Gaon ki auratein bartan leke bahar aa gayi, paani bharne. Bacche kagaz ki naav banane lage. Buddhe chaupal par baith ke kehte, "Is baar fasal achi hogi."

Barish tez ho gayi. Sab bheeg gaye, par koi andar nahi gaya. Kyunki pehli barish me bheegna mana nahi, tyohar hai. Azad ne us raat likha, "Barish paani nahi, dua hai, jo aasman se girti hai."`},{id:13,title:"Maa Ki Rasoi",tag:"Maa",readTime:"5 min",color:"#FECACA",content:`Maa ki rasoi me jadoo hota hai.

Bina measurement ke, bas haath se andaaze se, par swaad aisa ki hotel fail. Azad jab bhi sheher se gaon aata, pehle rasoi me jaata.

Maa kehti, "Haath dho le." Azad kehta, "Pehle khushboo le lu."

Rasoi choti si, par usme poora ghar basta tha. Ek kone me masale, dusre me aata, beech me chulha. Maa chulhe par roti sek ti, aur kahaniyan bhi.

"Beta, daal me namak kam hai to pyaar zyada daal de," maa kehti. Azad hasta, "Pyaar kaise daalte hain?"

Maa bolti, "Intezaar karke, pyaar se ghoont ke."

Aaj Azad sheher me akela rehta hai, khana banana seekh gaya, par woh swaad nahi aata. Kyunki maa ki rasoi me masala nahi, mamta thi. Jab bhi dil udaas hota, woh maa ko phone karta, "Maa, woh daal wali kahani phir se suna."`},{id:14,title:"Nadi Kinare",tag:"Nadi",readTime:"4 min",color:"#A5F3FC",content:`Nadi kinare baithne se mann shant ho jata hai.

Gaon ke bahar ek nadi behti thi, choti si, par kabhi sookhti nahi thi. Sham ko sab wahan jaate the. Koi kapde dhone, koi pair latkane.

Azad ko wahan likhna pasand tha. Nadi ka behta paani, jaise kahaniyan behti hain. Kabhi tez, kabhi dheere.

Ek buddhi aurat roz aati thi, nadi se baat karti thi. Azad ne pucha, "Dadi, nadi sunti hai?"

Dadi boli, "Haan, sab sunti hai. Tum kaho to sahi."

Azad ne nadi se kaha, "Mujhe bada lekhak bana de." Nadi behti rahi. Dadi hasi, "Nadi deti nahi, le jaati hai. Tumhara dar le jaayegi, phir tum khud ban jaoge."

Azad samajh gaya. Nadi ke paas jaana matlab apne aap ko de dena, behta chhod dena. Tab se woh roz nadi kinare jaata hai, kuch maangne nahi, bas behtne ke liye.`},{id:15,title:"Khet Ka Geet",tag:"Khet",readTime:"4 min",color:"#D9F99D",content:`Khet gaata hai, agar suno to.

Subah 5 baje, jab suraj nahi nikla hota, khet me hal chalta hai. "Charr... charr..." Jaise koi geet ho. Kisan ke pair me mitti, haath me hal, aur muh par geet.

Azad ke baba khet me gaate the, "Sona ugle, sona ugle, dharti sona ugle." Azad ko lagta tha, khet sach me sona ugalta hai, peela peela gehu.

Ek baar sukha pada, fasal nahi hui. Baba ne phir bhi geet gaya. Azad ne pucha, "Baba, fasal nahi hui, phir bhi gaana?"

Baba bole, "Khet geet se jeeta hai, fasal se nahi. Geet band ho gaya to khet mar jayega."

Us saal gehu kam hua, par khet ka geet nahi ruka. Agle saal fasal dugni hui. Gaon wale kehte hain, khet ko paani ke saath geet bhi chahiye. Aaj bhi jab Azad khet par jaata hai, to wahi geet sunta hai, jo baba gaate the.`},{id:16,title:"Raat Ka Musafir",tag:"Raat",readTime:"6 min",color:"#CBD5E1",content:`Raat ko musafir akela nahi hota.

Ek raat, 11 baje, gaon ki sadak par ek aadmi chal raha tha. Haath me jhola, kandhe par chadar. Koi nahi jaanta tha, kahan se aaya, kahan jaayega.

Azad ne use dekha, chai ki dukaan par. Dukaan band ho rahi thi, par Azad ne kaha, "Kaka, ek chai aur."

Musafir ne chai li, bina cheeni ki. Bola, "Raat me cheeni nahi, soch peeni chahiye."

Azad ne pucha, "Kahan ja rahe ho?" Musafir bola, "Jahan raat le jaaye."

Dono baat karte rahe. Musafir ne bataya, woh har gaon jaata hai, raat ko, kyunki raat me log sach bolte hain. Din me sab mask pehente hain.

Subah musafir chala gaya. Azad ko ek kagaz de gaya, jis par likha tha, "Raat se daro mat, raat me hi taare dikhte hain."

Azad ne woh kagaz apni kitaab me rakha hai. Jab bhi raat ko dar lagta hai, woh padh leta hai.`},{id:17,title:"School Ki Yaadein",tag:"Yaad",readTime:"4 min",color:"#FDE68A",content:`School ki deewaron par sirf syllabus nahi, yaadein likhi hoti hain.

Azad ka school, ek kamra, ek master, aur 20 bacche. Blackboard toota hua, par sapne poore.

Master ji kehte the, "Padhoge likhoge, banoge nawab." Bacche haste the, nawab kaun banta hai gaon me? Par padhte the.

Lunch me sabki roti alag, par achar ek dusre ka. Azad ki maa aam ka achar deti, sabko pasand.

Ek din school me inspection aaya, afsar ne pucha, "Bade hoke kya banoge?" Sabne kaha, doctor, teacher. Azad ne kaha, "Kahani wala."

Afsar hasa. Master ji ne kaha, "Kahani wala bhi nawab hota hai, dilon ka."

Aaj Azad nawab ban gaya, dilon ka. School ab bhi wahi hai, toota hua board, par us par ab bhi likha hai, "Padhoge likhoge..."`},{id:18,title:"Chidiya Aur Ped",tag:"Prakriti",readTime:"3 min",color:"#BBF7D0",content:`Ped aur chidiya ki dosti sabse purani hai.

Ek ped tha, akela, khet ke beech. Us par ek chidiya roz aati, ghosla banaya. Ped ko accha lagta, koi to hai baat karne ko.

Ek din tez aandhi aayi, ghosla gir gaya. Chidiya royi. Ped bola, "Mat ro, phir bana lenge."

Chidiya ne phir ghosla banaya, thoda mazboot. Ped ne apni tehni jhuka di, hawa se bachane ko.

Aise hi saal beet gaye. Chidiya ke bacche hue, ud gaye. Ped akela reh gaya. Par chidiya har saal aati, naye bacchon ke saath, purane ped se milne.

Ped ab bhi wahi hai, thoda jhuka hua, par khada hai. Kehte hain, uske neeche baitho to chidiya ki cheh-cheh sunai deti hai, dosti ki.`},{id:19,title:"Holi Ke Rang",tag:"Holi",readTime:"4 min",color:"#FCA5A5",content:`Holi par gaon ka rang hi alag hota hai.

Subah se hi bacche balti leke ghoomte, "Bura na mano, Holi hai." Har ghar se koi na koi bheeg ke nikalta.

Azad ko Holi pasand nahi thi, rang se allergy. Par uski maa kehti, "Rang se nahi, dil se khelo."

Ek Holi, usne dekha, ek buddha aadmi akela baitha hai, koi rang nahi lagata. Azad uske paas gaya, bola, "Baba, Holi nahi khelni?"

Baba bola, "Khelni hai, par koi khelne wala nahi."

Azad ne apne haath me thoda gulal liya, aur baba ke gaal par laga diya. Baba hasa, itna hasa ki aankh se paani aa gaya. Bola, "Aaj 10 saal baad Holi lagi."

Us din Azad ko samajh aaya, Holi rang ka nahi, yaad dilane ka tyohar hai, ki hum sab rang birange hain, par ek hi gaon ke.`},{id:20,title:"Diwali Ki Raat",tag:"Diwali",readTime:"5 min",color:"#FDE68A",content:`Diwali ki raat, andhera bhi roshni dhoondta hai.

Gaon me bijli kam aati thi, par Diwali par har ghar me diya jalta tha. Tel ka diya, chota sa, par uski roshni me poora aangan jagmag.

Azad ki maa har saal 21 diye jalati thi. Azad puchta, "Maa, itne saare kyu?" Maa kehti, "Ek apne liye, baaki sabke liye, jinke ghar me diya nahi."

Azad ko lagta tha, diya jalana bas roshni nahi, dua hai.

Ek Diwali, tez hawa chali, diye bujhne lage. Bacche pareshan. Tab Azad ki maa ne kaha, "Haath se aanchal banao, hawa rok lo, diya jalne do."

Sabne aanchal se hawa roki, diye jalte rahe. Tab samajh aaya, Diwali par diya akela nahi jalta, sab milke jalate hain.

Aaj bhi Diwali par, Azad 21 diye jalata hai, sheher me bhi. Ek apne liye, 20 un kahaniyon ke liye, jo usne likhi, aur jo abhi likhni baaki hain.`}],Ri=[{id:1,title:"Gaon ki subah \uD83C\uDF3E",author:"@azad_gaon",likes:"12.4k",colorFrom:"#FE9A00",colorTo:"#7C3AED"},{id:2,title:"Bhoot wala ped \uD83D\uDC7B",author:"@kahani_bhoot",likes:"8.9k",colorFrom:"#0F172A",colorTo:"#334155"},{id:3,title:"Chai aur prem ☕❤️",author:"@prem_chai",likes:"22k",colorFrom:"#EC4899",colorTo:"#F59E0B"},{id:4,title:"Pahad bula rahe hain \uD83C\uDFD4️",author:"@pahad_lover",likes:"5.3k",colorFrom:"#10B981",colorTo:"#0E7490"},{id:5,title:"Samandar ke saath",author:"@lehren",likes:"18k",colorFrom:"#06B6D4",colorTo:"#3B82F6"},{id:6,title:"Tracksuit boy \uD83D\uDE0E",author:"@azad_style",likes:"31k",colorFrom:"#111827",colorTo:"#4B5563"}];function Oi(){let[e,n]=Y.useState("home"),[t,r]=Y.useState(!1),[l,u]=Y.useState(!1),[o,i]=Y.useState(null),[a,f]=Y.useState(0),[m,h]=Y.useState(!0),[v,S]=Y.useState(new Set([1])),[E,w]=Y.useState(null),[L,c]=Y.useState(""),[s,d]=Y.useState(""),[g,N]=Y.useState(null),[z,P]=Y.useState(!1),[x,A]=Y.useState([{role:"ai",text:"Salam! Main Azad AI hoon. Kahani, sawal, kuch bhi pucho - Hindi me jawab dunga. 'Ek kahani likho' bolo, likh deta hoon."}]),[D,Ve]=Y.useState(!1),[An,Tc]=Y.useState(am),Mi=Y.useRef(null),xc=["ghost story \uD83D\uDC7B","tracksuit boy \uD83D\uDE0E","gaon ki kahani \uD83C\uDF3E","bhoot aur baccha","prem kahani ❤️","jungle ka raaz \uD83C\uDF32","samandar \uD83C\uDF0A","pahad \uD83C\uDFD4️"];Y.useEffect(()=>{if(E){let k=setTimeout(()=>w(null),2500);return()=>clearTimeout(k)}},[E]);let Li=(k)=>{if(k==="AI")r(!1),setTimeout(()=>u(!0),200);else w(`${k} khula - demo mode`)},Fc=()=>{if(!s.trim()){w("Pehle kuch likho - jaise 'Ek bhoot ki kahani'");return}P(!0),setTimeout(()=>{let k=s.toLowerCase(),F="";if(k.includes("salam")||k.includes("salaam"))F="Wa alaikum assalam! Kya haal hai? Batao kaunsi kahani sunni hai?";else if(k.includes("kahani")||k.include
